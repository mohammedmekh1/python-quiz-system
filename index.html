<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات - أساسيات البرمجة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/survey-core/defaultV2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-i18n"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; direction: rtl; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    #surveyContainer { margin-top: 20px; min-height: 500px; }
    #loading, #error { text-align: center; display: none; margin: 20px; }
    #error { color: #d32f2f; font-weight: bold; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="quizTitle">اختبار البرمجة</h1>
    <div id="studentForm">
      <input type="text" id="studentName" placeholder="الاسم الكامل" required />
      <input type="email" id="studentEmail" placeholder="البريد الإلكتروني" required />
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>
    <div id="loading">جاري تحميل الأسئلة...</div>
    <div id="error"></div>
    <div id="surveyContainer"></div>
  </div>

  <script>
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";

    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token');

    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !email.includes('@')) {
        alert('يرجى إدخال البيانات بشكل صحيح');
        return;
      }

      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const fetchUrl = `${GET_URL}?exam=${examId}&token=${token}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        const response = await fetch(fetchUrl);
        const surveyData = await response.json();

        document.getElementById('loading').style.display = 'none';

        // تهيئة ورسم الاختبار
        const survey = new Survey.Model(surveyData);
        survey.locale = "ar"; 
        
        // التأكد من ظهور الحاوية ورسم الاختبار
        const container = document.getElementById("surveyContainer");
        container.style.display = "block";
        survey.render("surveyContainer");

        survey.onComplete.add(async (sender) => {
          await fetch(POST_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              exam: examId,
              studentName: name,
              studentEmail: email,
              answers: sender.data
            })
          });
        });
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = "فشل في عرض الاختبار. تأكد من اتصال الإنترنت.";
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
