<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام اختبارات بايثون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/jquery"></script>
    <script src="https://unpkg.com/survey-core@1.9.110/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@1.9.110/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-jquery@1.9.110/survey.jquery.min.js"></script>
    <link href="https://unpkg.com/survey-core@1.9.110/defaultV2.min.css" rel="stylesheet"/>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #10b981;
            --primary-light: #3b82f6;
            --primary-dark: #1e40af;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --background: #f9fafb;
            --white: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--background); margin: 0; padding: 20px; min-height: 100vh; color: var(--text-primary); }
        .container { max-width: 900px; margin: 0 auto; background: var(--white); border-radius: 16px; box-shadow: 0 10px 30px var(--shadow); overflow: hidden; border-top: 5px solid var(--primary-color); }
        .header { background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%); color: var(--white); padding: 30px; text-align: center; }
        .exam-title { font-size: 22px; font-weight: 700; color: var(--primary-color); text-align: center; padding: 20px; border-bottom: 2px solid #e5e7eb; background: #f8fafc; display: none; }
        .timer-display { font-size: 28px; font-weight: 700; color: var(--primary-color); text-align: center; padding: 20px; background: rgba(30, 58, 138, 0.05); border-radius: 12px; margin: 20px; }
        .timer-display.danger { color: #ef4444; animation: pulse 1s infinite; }
        #surveyContainer { padding: 20px; display: none; }
        .error-message { color: #ef4444; text-align: center; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 12px; margin: 20px; font-weight: 700; display: none; border-right: 5px solid #ef4444; }
        .success-message { color: var(--secondary-color); text-align: center; padding: 30px; background: rgba(16, 185, 129, 0.1); border-radius: 16px; margin: 20px; font-size: 22px; display: none; }
        .loading { text-align: center; padding: 60px 20px; }
        .loading-spinner { width: 50px; height: 50px; border: 5px solid rgba(30, 58, 138, 0.1); border-top: 5px solid var(--primary-color); border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 نظام اختبارات بايثون</h1>
            <p>يرجى الإجابة على جميع الأسئلة بدقة</p>
        </div>
        <div id="examTitle" class="exam-title"></div>
        <div class="timer-display" id="timerDisplay">⏱️ جاري التحميل...</div>
        <div class="error-message" id="errorMessage"></div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <h2>جاري جلب بيانات الاختبار...</h2>
        </div>

        <div id="surveyContainer"></div>
        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        let examId = '';
        let examToken = '';
        let timeLimit = 0;
        let startTime = null;
        let timerInterval = null;
        let survey = null;

        // الرابط الأساسي لـ n8n
        const BASE_URL = 'https://n8n.srv1332143.hstgr.cloud/webhook';

        $(document).ready(async function() {
            await loadSurveyData();
        });

        async function loadSurveyData() {
            const urlParams = new URLSearchParams(window.location.search);
            // دعم اسم المتغير 'exam' أو 'exam_id' لمرونة أكثر
            examId = urlParams.get('exam') || urlParams.get('exam_id');
            examToken = urlParams.get('token');

            if (!examId || !examToken) {
                showError('❌ خطأ: معرف الامتحان أو الرمز (Token) مفقود في الرابط.');
                return;
            }

            try {
                // الاتصال المباشر بـ n8n (يتطلب تفعيل CORS في n8n)
                const response = await fetch(`${BASE_URL}/get-survey?exam=${examId}&token=${examToken}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`الخادم استجاب بخطأ: ${response.status}`);

                const data = await response.json();

                if (data.success === false) {
                    showError(data.message || 'فشل في تحميل الاختبار.');
                    return;
                }

                // إعداد واجهة الاختبار
                document.getElementById('examTitle').textContent = data.title || 'اختبار جديد';
                document.getElementById('examTitle').style.display = 'block';
                
                timeLimit = (data.duration_min || 15) * 60;
                startTime = Date.now();
                
                startTimer();
                initializeSurvey(data);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('surveyContainer').style.display = 'block';

            } catch (error) {
                console.error('Fetch Error:', error);
                showError('❌ فشل الاتصال بمركز الاختبارات. تأكد من أن الـ Workflow مفعّل في n8n.');
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const remaining = timeLimit - elapsed;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    if (survey) survey.completeLastPage();
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    const display = document.getElementById('timerDisplay');
                    display.textContent = `⏱️ الوقت المتبقي: ${mins}:${secs.toString().padStart(2, '0')}`;
                    if (remaining < 60) display.classList.add('danger');
                }
            }, 1000);
        }

        function initializeSurvey(surveyJSON) {
            Survey.surveyLocalization.currentLocale = "ar";
            survey = new Survey.Model(surveyJSON);
            
            survey.onComplete.add((sender) => {
                submitSurvey(sender.data);
            });

            $("#surveyContainer").Survey({ model: survey });
        }

        async function submitSurvey(answers) {
            document.getElementById('surveyContainer').style.display = 'none';
            document.getElementById('loading').innerHTML = '<div class="loading-spinner"></div><h2>جاري تصحيح إجاباتك...</h2>';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`${BASE_URL}/submit-exam`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam: examId,
                        token: examToken,
                        answers: answers,
                        finishedAt: new Date().toISOString()
                    })
                });

                const result = await response.json();
                showSuccess(result);
            } catch (error) {
                showError('❌ حدث خطأ أثناء إرسال الإجابات، لكن تم حفظها محلياً.');
            } finally {
                if (timerInterval) clearInterval(timerInterval);
            }
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function showSuccess(result) {
            document.getElementById('loading').style.display = 'none';
            const msg = document.getElementById('successMessage');
            msg.innerHTML = `
                <h2>✅ تم الإرسال بنجاح!</h2>
                <p style="font-size:24px; color:#1e3a8a;">درجتك: ${result.score || 0} من ${result.max || 0}</p>
                <p>${result.message || 'تحقق من تليجرام لمزيد من التفاصيل.'}</p>
            `;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
