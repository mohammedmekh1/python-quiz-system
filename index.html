<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاختبارات الاحترافي</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SurveyJS Libraries (Knockout Version - Essential for rendering) -->
    <script src="https://unpkg.com/knockout@3.5.1/build/output/knockout-latest.js"></script>
    <script src="https://unpkg.com/survey-knockout@1.9.120/survey.ko.min.js"></script>
    <link href="https://unpkg.com/survey-knockout@1.9.120/survey.css" rel="stylesheet"/>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Icons & Confetti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Light Mode (خلفية بيضاء) */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e3a8a; /* أزرق ملكي */
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent: #1e3a8a;
            --accent-hover: #1d4ed8;
            --accent-light: rgba(30, 58, 138, 0.08);
            --border: #e2e8f0;
            --shadow: rgba(30, 58, 138, 0.05);
            --success: #059669;
            --danger: #dc2626;
        }
        
        /* Dark Mode */
        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: rgba(59, 130, 246, 0.15);
            --border: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        
        body {
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }
        
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Form Inputs Style */
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        .form-input::placeholder { color: var(--text-muted); }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        /* Timer & Theme Toggle */
        .timer-ring { transform: rotate(-90deg); }
        .timer-ring-progress { stroke: var(--accent); transition: stroke-dashoffset 1s linear; }
        .timer-warning .timer-ring-progress { stroke: var(--danger); }
        
        .theme-toggle {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: var(--accent-light); border-color: var(--accent); }
        
        /* SurveyJS Custom Styles */
        .sd-root-modern {
            --primary: var(--accent) !important;
            --primary-light: var(--accent-light) !important;
            --background: var(--bg-secondary) !important;
            --background-dim: var(--bg-tertiary) !important;
            --foreground: var(--text-primary) !important;
            --border: var(--border) !important;
            font-family: 'Cairo', sans-serif !important;
        }
        
        .sd-root-modern .sd-question__title { font-weight: 600 !important; color: var(--text-primary) !important; font-size: 1.05rem !important; }
        
        .sd-root-modern .sd-item {
            background: var(--bg-tertiary) !important;
            border: 2px solid var(--border) !important;
            border-radius: 10px !important;
            padding: 12px 16px !important;
            margin-bottom: 8px !important;
            transition: all 0.2s ease !important;
        }
        .sd-root-modern .sd-item:hover { border-color: var(--accent) !important; }
        .sd-root-modern .sd-item--checked { border-color: var(--accent) !important; background: var(--accent-light) !important; }
        .sd-root-modern .sd-item__control-label { color: var(--text-primary) !important; font-family: 'Cairo', sans-serif !important; }
        
        .sd-root-modern .sd-btn {
            background: var(--accent) !important;
            color: white !important;
            font-family: 'Cairo', sans-serif !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            padding: 10px 24px !important;
            border: none !important;
        }
        .sd-root-modern .sd-btn:hover { background: var(--accent-hover) !important; transform: translateY(-1px); }
        .sd-root-modern .sd-navigation__complete-btn { background: var(--success) !important; }
        
        .sd-root-modern .sd-body, .sd-root-modern .sd-page { background: transparent !important; }
        .sd-root-modern .sd-question { padding: 0 !important; }
        .sd-root-modern .sd-selectbase { padding: 0 !important; border: none !important; }
        .sd-root-modern .sd-progress { background: var(--bg-tertiary) !important; border-radius: 4px; }
        .sd-root-modern .sd-progress__bar { background: var(--accent) !important; }

        /* Score Circle */
        .score-circle { position: relative; width: 140px; height: 140px; }
        .score-circle svg { transform: rotate(-90deg); }
        .score-circle-bg { fill: none; stroke: var(--border); stroke-width: 10; }
        .score-circle-progress { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.2s ease; }
        .score-value { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="card fixed top-0 left-0 right-0 z-50 rounded-none border-t-0 border-l-0 border-r-0">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--accent);">
                    <i class="fas fa-graduation-cap text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold" style="color: var(--text-primary);">نظام الاختبارات</h1>
                    <p id="header-subtitle" class="text-xs" style="color: var(--text-muted);">اللوحة الرئيسية</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Timer (Hidden initially) -->
                <div id="timer-wrapper" class="hidden">
                    <div id="timer-container" class="flex items-center gap-2 px-3 py-2 rounded-lg" style="background: var(--bg-tertiary); border: 1px solid var(--border);">
                        <svg class="timer-ring" width="32" height="32">
                            <circle stroke="var(--border)" stroke-width="3" fill="transparent" r="13" cx="16" cy="16"/>
                            <circle id="timer-progress" class="timer-ring-progress" stroke-width="3" fill="transparent" r="13" cx="16" cy="16" stroke-dasharray="81.7" stroke-dashoffset="0" stroke-linecap="round"/>
                        </svg>
                        <div id="timer-display" class="text-base font-bold font-mono" style="color: var(--text-primary);">00:00</div>
                    </div>
                </div>
                
                <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 container mx-auto px-4 pt-24 pb-8 min-h-screen">
        
        <!-- 1. Student Form State -->
        <div id="student-form-state" class="max-w-md mx-auto pt-10">
            <div class="card p-8 fade-in">
                <div class="text-center mb-6">
                    <h2 class="text-xl font-bold" style="color: var(--text-primary);">بدء الاختبار</h2>
                    <p class="text-sm mt-1" style="color: var(--text-muted);">يرجى إدخال بياناتك للمتابعة</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: var(--text-secondary);">الاسم الكامل</label>
                        <input type="text" id="studentName" class="form-input" placeholder="الاسم الثلاثي" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: var(--text-secondary);">البريد الإلكتروني</label>
                        <input type="email" id="studentEmail" class="form-input" placeholder="example@domain.com" />
                    </div>
                    <button onclick="startExamProcess()" class="btn-primary mt-2">
                        <i class="fas fa-play-circle ml-2"></i> ابدأ الآن
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Loading State -->
        <div id="loading-state" class="hidden flex flex-col items-center justify-center min-h-[70vh]">
            <div class="card p-8 text-center fade-in max-w-md w-full">
                <div class="spinner mx-auto mb-4"></div>
                <h2 class="text-lg font-bold mb-1" style="color: var(--text-primary);">جاري تحميل الاختبار</h2>
                <p id="loading-message" style="color: var(--text-secondary);">يرجى الانتظار...</p>
            </div>
        </div>

        <!-- 3. Error State -->
        <div id="error-state" class="hidden">
            <div class="max-w-lg mx-auto card p-8 text-center fade-in">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5" style="background: rgba(220, 38, 38, 0.1);">
                    <i class="fas fa-exclamation-triangle text-3xl" style="color: var(--danger);"></i>
                </div>
                <h2 class="text-xl font-bold mb-2" style="color: var(--text-primary);">حدث خطأ</h2>
                <p id="error-message" class="mb-5" style="color: var(--text-secondary);"></p>
                <button onclick="location.reload()" class="px-6 py-2 rounded-lg font-semibold text-white" style="background: var(--accent);">
                    <i class="fas fa-redo ml-2"></i>إعادة المحاولة
                </button>
            </div>
        </div>

        <!-- 4. Survey Wrapper -->
        <div id="survey-wrapper" class="hidden">
            <div id="exam-info" class="card p-4 mb-4 fade-in">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 id="exam-title" class="text-lg font-bold" style="color: var(--text-primary);"></h2>
                        <p id="exam-description" class="text-sm" style="color: var(--text-secondary);"></p>
                    </div>
                    <div class="flex items-center gap-5">
                        <div class="text-center">
                            <div id="questions-count" class="text-xl font-bold" style="color: var(--accent);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">سؤال</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card p-5 fade-in">
                <div id="surveyContainer"></div>
            </div>
        </div>

        <!-- 5. Submitting State -->
        <div id="submitting-state" class="hidden flex flex-col items-center justify-center min-h-[70vh]">
            <div class="card p-8 text-center fade-in max-w-md w-full">
                <div class="spinner mx-auto mb-4"></div>
                <h2 class="text-lg font-bold mb-1" style="color: var(--text-primary);">جاري الإرسال</h2>
            </div>
        </div>

        <!-- 6. Success State -->
        <div id="success-state" class="hidden max-w-xl mx-auto">
            <div class="card p-6 text-center fade-in">
                <div id="result-icon" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center"></div>
                <h2 id="result-title" class="text-2xl font-bold mb-1" style="color: var(--text-primary);"></h2>
                <p id="result-message" class="mb-6" style="color: var(--text-secondary);"></p>

                <div class="flex justify-center mb-6">
                    <div class="score-circle">
                        <svg width="140" height="140" viewBox="0 0 140 140">
                            <circle class="score-circle-bg" cx="70" cy="70" r="60"/>
                            <circle id="score-progress" class="score-circle-progress" cx="70" cy="70" r="60"/>
                        </svg>
                        <div class="score-value">
                            <span id="score-percentage" class="text-3xl font-black" style="color: var(--text-primary);">0%</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="stat-card">
                        <div id="score-value" class="text-2xl font-bold" style="color: var(--accent);">0</div>
                        <div class="text-xs" style="color: var(--text-muted);">درجتك</div>
                    </div>
                    <div class="stat-card">
                        <div id="max-value" class="text-2xl font-bold" style="color: var(--success);">0</div>
                        <div class="text-xs" style="color: var(--text-muted);">الدرجة الكاملة</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ===== Configuration =====
        const CONFIG = {
            BASE_URL: 'https://n8n.srv1332143.hstgr.cloud/webhook',
            ENDPOINTS: { GET_SURVEY: '/get-survey', SUBMIT_EXAM: '/submit-exam' }
        };

        // ===== State =====
        const state = {
            examId: new URLSearchParams(window.location.search).get('exam'),
            examToken: new URLSearchParams(window.location.search).get('token'),
            timeLimit: 0,
            startTime: null,
            timerInterval: null,
            survey: null,
            isDark: false
        };

        // ===== Theme Logic =====
        function toggleTheme() {
            state.isDark = !state.isDark;
            localStorage.setItem('quiz-theme', state.isDark ? 'dark' : 'light');
            applyTheme();
        }

        function applyTheme() {
            const icon = document.getElementById('theme-icon');
            if (state.isDark) {
                document.documentElement.classList.add('dark');
                icon.className = 'fas fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                icon.className = 'fas fa-moon';
            }
        }

        // ===== Initialization =====
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quiz-theme');
            if (savedTheme === 'dark') state.isDark = true;
            applyTheme();

            if (!state.examId || !state.examToken) {
                showError('رابط غير صالح', 'معرف الاختبار مفقود.');
            }
        });

        // ===== Process Flow =====
        async function startExamProcess() {
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();

            if (!name || !email.includes('@')) {
                alert('يرجى إدخال الاسم والبريد الإلكتروني بشكل صحيح');
                return;
            }

            // Switch UI
            document.getElementById('student-form-state').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('loading-state').classList.add('flex');

            await loadSurveyData(name, email);
        }

        async function loadSurveyData(name, email) {
            try {
                const response = await fetch(
                    `${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.GET_SURVEY}?exam=${state.examId}&token=${state.examToken}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`
                );

                if (!response.ok) throw new Error('فشل الاتصال');

                let data = await response.json();
                
                // Data Cleaning
                if (Array.isArray(data)) data = data[0];
                
                // Fix: Remove correct answers for security
                if (data.pages) {
                    data.pages.forEach(p => p.elements?.forEach(q => {
                        if (q.correctAnswer) delete q.correctAnswer;
                        if (q.choices && q.choices.length === 1 && q.choices[0] === 'Error') {
                            q.choices = ['خيار أ', 'خيار ب', 'خيار ج', 'خيار د'];
                        }
                    }));
                }

                // Fix: Split questions to ensure Next/Prev buttons appear
                if (data.pages && data.pages.length === 1 && data.pages[0].elements?.length > 1) {
                    const questions = data.pages[0].elements;
                    data.pages = questions.map((q, i) => ({ name: "page" + i, elements: [q] }));
                }

                // Fix: Disable start page to avoid blank screen
                if (data.firstPageIsStarted) data.firstPageIsStarted = false;

                initializeExam(data, name, email);

            } catch (err) {
                showError('فشل التحميل', err.message);
            }
        }

        function initializeExam(data, name, email) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('survey-wrapper').classList.remove('hidden');
            document.getElementById('timer-wrapper').classList.remove('hidden');

            document.getElementById('exam-title').textContent = data.title || 'اختبار';
            document.getElementById('questions-count').textContent = data.pages?.length || 0;

            // Init Survey
            Survey.surveyLocalization.currentLocale = 'ar';
            state.survey = new Survey.Model(data);
            
            state.survey.onComplete.add((sender) => submitExam(sender.data, name, email));
            
            state.survey.render("surveyContainer");
        }

        // ===== Submit =====
        async function submitExam(answers, name, email) {
            document.getElementById('survey-wrapper').classList.add('hidden');
            document.getElementById('submitting-state').classList.remove('hidden');

            try {
                const response = await fetch(`${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.SUBMIT_EXAM}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam: state.examId, token: state.examToken,
                        studentName: name, studentEmail: email,
                        answers: answers, finishedAt: new Date().toISOString()
                    })
                });
                const res = await response.json();
                showSuccess(res);
            } catch (e) {
                showSuccess({ score: 0, max: 0 }); // Fallback UI
            }
        }

        // ===== UI Helpers =====
        function showError(title, msg) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('student-form-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.querySelector('#error-state h2').textContent = title;
            document.getElementById('error-message').textContent = msg;
        }

        function showSuccess(result) {
            document.getElementById('submitting-state').classList.add('hidden');
            document.getElementById('success-state').classList.remove('hidden');

            const score = result.score || 0;
            const max = result.max || 100;
            const pct = max > 0 ? Math.round((score/max)*100) : 0;

            document.getElementById('score-value').textContent = score;
            document.getElementById('max-value').textContent = max;
            document.getElementById('score-percentage').textContent = pct + '%';

            setTimeout(() => {
                const circle = document.getElementById('score-progress');
                const circ = 2 * Math.PI * 60;
                circle.style.strokeDashoffset = circ - (pct/100)*circ;
            }, 100);

            if (pct >= 80 && typeof confetti !== 'undefined') {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 }, colors: ['#1e3a8a', '#059669', '#f59e0b'] });
            }
        }
    </script>
</body>
</html>
