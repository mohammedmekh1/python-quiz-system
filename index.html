<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات - أساسيات البرمجة</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://unpkg.com/survey-core/defaultV2.min.css" rel="stylesheet" />
  
  <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-core/survey.i18n.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #2b4ec2; }
    #surveyContainer { margin-top: 30px; min-height: 500px; }
    #loading, #error { text-align: center; font-size: 18px; margin: 30px 0; display: none; }
    #error { color: #d32f2f; font-weight: bold; }
    #loading { color: #1e3a8a; }
    #debugInfo { background: #f5f5f5; padding: 15px; margin-top: 20px; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; direction: ltr; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="mainTitle">تحميل الاختبار...</h1>
    
    <div id="studentForm">
      <div class="form-group">
        <label for="studentName">الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك هنا" required />
      </div>
      <div class="form-group">
        <label for="studentEmail">البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>

    <div id="loading">جاري جلب الأسئلة من السيرفر...</div>
    <div id="error"></div>
    <div id="surveyContainer"></div>
    <div id="debugInfo"></div>
  </div>

  <script>
    // 1. روابط الـ Webhook الخاصة بك في n8n
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";

    // 2. استخراج المعطيات من الرابط (URL Parameters)
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token');

    // تحديث العنوان بناءً على معرف الاختبار
    if (examId) {
      document.getElementById('mainTitle').textContent = `اختبار: ${examId}`;
    }

    // دالة لعرض معلومات التصحيح
    function showDebug(info) {
      const debugDiv = document.getElementById('debugInfo');
      debugDiv.style.display = 'block';
      debugDiv.innerHTML = '<strong>Debug Info:</strong><br>' + JSON.stringify(info, null, 2);
    }

    // 3. الدالة الأساسية لبدء الاختبار
    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      // التحقق من المدخلات
      if (!name || !email.includes('@')) {
        alert('يرجى إدخال اسمك وبريدك الإلكتروني بشكل صحيح');
        return;
      }

      if (!examId || !token) {
        alert('خطأ: معرف الاختبار أو التوكن مفقود من الرابط');
        return;
      }

      // إخفاء النموذج وإظهار رسالة التحميل
      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        // بناء الرابط لجلب الأسئلة
        const fetchUrl = `${GET_URL}?exam=${encodeURIComponent(examId)}&token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        
        const response = await fetch(fetchUrl);
        
        if (!response.ok) {
          throw new Error("فشل في جلب البيانات من السيرفر. تأكد من صحة التوكن.");
        }

        // استخراج أول عنصر إذا كانت البيانات مصفوفة
        const responseData = await response.json();
        const surveyData = Array.isArray(responseData) ? responseData[0] : responseData;
        
        console.log("البيانات المستلمة:", surveyData);
        showDebug({ receivedData: surveyData });

        // فحص هيكل البيانات
        if (!surveyData || typeof surveyData !== 'object') {
          throw new Error("البيانات المستلمة غير صالحة");
        }

        if (!surveyData.pages || !Array.isArray(surveyData.pages)) {
          throw new Error("هيكل البيانات غير صحيح: pages مفقودة أو ليست مصفوفة");
        }

        if (surveyData.pages.length === 0) {
          throw new Error("لا توجد صفحات في هذا الاختبار");
        }

        // فحص كل صفحة
        surveyData.pages.forEach((page, index) => {
          console.log(`الصفحة ${index}:`, page);
          if (!page.elements || !Array.isArray(page.elements)) {
            console.warn(`الصفحة ${index} لا تحتوي على elements`);
            page.elements = []; // إنشاء مصفوفة فارغة إذا لم تكن موجودة
          }
        });

        console.log("عدد الصفحات:", surveyData.pages.length);
        console.log("إجمالي الأسئلة:", surveyData.pages.reduce((sum, p) => sum + (p.elements?.length || 0), 0));

        // إخفاء التحميل
        document.getElementById('loading').style.display = 'none';

        // تهيئة واجهة الاختبار SurveyJS
        const survey = new Survey.Model(surveyData);
        
        // ضبط اللغة للعربية لضمان اتجاه النص الصحيح
        survey.locale = "ar";

        // رسم الاختبار داخل الحاوية
        survey.render("surveyContainer");

        // إرسال النتائج عند الضغط على زر "إرسال" (Complete)
        survey.onComplete.add(async (sender) => {
          const results = {
            exam: examId,
            token: token,
            studentName: name,
            studentEmail: email,
            answers: sender.data,
            finishedAt: new Date().toISOString()
          };

          try {
            await fetch(POST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(results)
            });
            console.log("تم إرسال النتائج بنجاح");
          } catch (postErr) {
            console.error("خطأ في إرسال النتائج:", postErr);
          }
        });

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = "خطأ: " + err.message;
        document.getElementById('error').style.display = 'block';
        console.error("Error Details:", err);
        showDebug({ error: err.message, stack: err.stack });
      }
    }
  </script>
</body>
</html>
