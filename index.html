<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- SurveyJS (تم التحديث لإصدار أحدث لضمان التوافق) -->
  <link href="https://unpkg.com/survey-core@1.12.0/defaultV2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-core@1.12.0/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-core@1.12.0/survey.i18n.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #2b4ec2; }
    #surveyContainer { margin-top: 30px; min-height: 500px; }
    
    /* تحسينات رسائل الحالة */
    .status-box { text-align: center; font-size: 18px; margin: 30px 0; padding: 20px; border-radius: 8px; }
    #error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    #loading { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
    
    /* مؤشر تحميل بسيط */
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1e3a8a; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* تنسيق SurveyJS RTL */
    .sd-root-modern { direction: rtl !important; text-align: right; }
    .sd-body { direction: rtl !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="mainTitle">اختبار</h1>
    
    <div id="studentForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك هنا" required />
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>

    <div id="loading" class="status-box" style="display:none;">
        <div class="spinner"></div>
        جاري تحميل الاختبار...
    </div>
    
    <div id="error" class="status-box" style="display:none;"></div>
    
    <div id="surveyContainer"></div>
  </div>

  <script>
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";
    
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token');

    // التحقق المبدئي من الرابط
    if (!examId || !token) {
        document.getElementById('studentForm').innerHTML = '<div class="status-box" style="background:#ffebee; color:#c62828;">رابط الاختبار غير صالح أو مفقود. يرجى التأكد من الرابط المرسل إليك.</div>';
    }

    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!name || !emailRegex.test(email)) {
        alert('يرجى إدخال الاسم والبريد الإلكتروني بشكل صحيح');
        return;
      }

      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';

      try {
        const fetchUrl = `${GET_URL}?exam=${encodeURIComponent(examId)}&token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error("فشل في الاتصال بالخادم");
        
        const responseData = await response.json();
        let surveyJson = Array.isArray(responseData) ? responseData[0] : responseData;
        
        // معالجة البيانات
        if (surveyJson.pages) {
          surveyJson.pages.forEach(page => {
            if (page.elements) {
              page.elements.forEach(q => {
                if (q.correctAnswer) delete q.correctAnswer; // أمان
                if (q.choices && q.choices.length === 1 && q.choices[0] === 'Error') {
                  q.choices = ['خيار أ', 'خيار ب', 'خيار ج', 'خيار د']; // حماية من الخطأ
                }
              });
            }
          });
        }

        // تعطيل صفحة البداية التلقائية لتجنب مشاكل العرض
        if (surveyJson.firstPageIsStarted) {
          surveyJson.firstPageIsStarted = false;
        }
        
        document.getElementById('loading').style.display = 'none';

        const survey = new Survey.Model(surveyJson);
        survey.locale = "ar";
        survey.showNavigationButtons = true;
        survey.showProgressBar = "top";
        
        const container = document.getElementById('surveyContainer');
        survey.render(container);

        // عند الإكمال
        survey.onComplete.add(async (sender) => {
          container.innerHTML = '<div class="status-box" style="background:#e8f5e9; color:#2e7d32;">جاري إرسال إجاباتك...</div>';
          
          const results = {
            exam: examId,
            token: token,
            studentName: name,
            studentEmail: email,
            answers: sender.data,
            finishedAt: new Date().toISOString()
          };

          try {
            const postResponse = await fetch(POST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(results)
            });
            
            if(postResponse.ok) {
                container.innerHTML = '<div class="status-box" style="background:#e8f5e9; color:#2e7d32; font-size:22px;">تم إرسال الإجابات بنجاح! شكراً لمشاركتك.</div>';
            } else {
                throw new Error("خطأ في الإرسال");
            }
          } catch (e) {
            container.innerHTML = '<div class="status-box" id="error" style="display:block;">حدث خطأ أثناء إرسال الإجابات، يرجى التواصل مع الدعم.</div>';
            console.error(e);
          }
        });

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = "حدث خطأ في تحميل الاختبار: " + err.message;
        document.getElementById('error').style.display = 'block';
        console.error(err);
      }
    }
  </script>
</body>
</html>
