<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الامتحانات الإلكترونية</title>
    
    <!-- SurveyJS -->
    <script src="https://unpkg.com/survey-core@2.5.10/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.10/survey.i18n.min.js"></script>
    <link href="https://unpkg.com/survey-core@2.5.10/defaultV2.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* ========== المتغيرات الأساسية ========== */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --success: #22c55e;
            --success-light: #dcfce7;
            --error: #ef4444;
            --error-light: #fef2f2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        /* ========== إعادة تعيين الأنماط الأساسية ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        /* ========== الحاوية الرئيسية ========== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== البطاقات ========== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .card-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .card-body {
            padding: 30px;
        }

        /* ========== حالات التحميل ========== */
        .loading-screen, .error-screen, .result-screen {
            text-align: center;
            padding: 60px 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* ========== رسائل الخطأ ========== */
        .error-icon {
            width: 80px;
            height: 80px;
            background: var(--error-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            color: var(--error);
        }

        .error-title {
            font-size: 1.5rem;
            color: var(--error);
            margin-bottom: 10px;
        }

        .error-message {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* ========== شاشة التسجيل ========== */
        .registration-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .form-label .required {
            color: var(--error);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            direction: rtl;
            text-align: right;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* ========== شارات المعلومات ========== */
        .info-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--background);
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge svg {
            width: 18px;
            height: 18px;
        }

        /* ========== الأزرار ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--background);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* ========== الفاصل ========== */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        /* ========== شريط الوقت ========== */
        .timer-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .timer-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .timer-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .timer-value.warning {
            color: #fbbf24;
            animation: pulse 1s infinite;
        }

        .timer-value.danger {
            color: #fca5a5;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .timer-progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .timer-progress-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 1s linear;
        }

        /* ========== حاوية الامتحان ========== */
        .exam-container {
            padding-top: 100px;
        }

        .exam-container.no-timer {
            padding-top: 20px;
        }

        /* ========== شاشة النتائج ========== */
        .result-header {
            padding: 40px;
            text-align: center;
        }

        .result-header.passed {
            background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
            color: white;
        }

        .result-header.failed {
            background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
            color: white;
        }

        .result-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .result-icon svg {
            width: 48px;
            height: 48px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        /* ========== إحصائيات النتيجة ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 30px;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: var(--background);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-value.success { color: var(--success); }
        .stat-value.error { color: var(--error); }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ========== تفاصيل الأسئلة ========== */
        .questions-details {
            padding: 0 30px 30px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .question-item {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 2px solid;
        }

        .question-item.correct {
            background: var(--success-light);
            border-color: var(--success);
        }

        .question-item.incorrect {
            background: var(--error-light);
            border-color: var(--error);
        }

        .question-item.unanswered {
            background: var(--warning-light);
            border-color: var(--warning);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .question-icon {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-item.correct .question-icon {
            background: var(--success);
            color: white;
        }

        .question-item.incorrect .question-icon {
            background: var(--error);
            color: white;
        }

        .question-item.unanswered .question-icon {
            background: var(--warning);
            color: white;
        }

        .question-icon svg {
            width: 16px;
            height: 16px;
        }

        .question-content {
            flex: 1;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .question-answer {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .question-answer span {
            color: var(--text-muted);
        }

        .question-answer .correct-answer {
            color: var(--success);
            font-weight: 600;
        }

        .question-answer .wrong-answer {
            color: var(--error);
            font-weight: 600;
        }

        .question-points {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ========== معلومات التسليم ========== */
        .submission-info {
            text-align: center;
            padding: 20px;
            background: var(--background);
            border-radius: 12px;
            margin: 0 30px 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .submission-info p {
            margin: 4px 0;
        }

        /* ========== طباعة التقرير ========== */
        .print-btn {
            margin: 0 30px 30px;
        }

        @media print {
            body {
                background: white;
            }
            .timer-bar, .print-btn {
                display: none;
            }
            .container {
                min-height: auto;
            }
            .card {
                box-shadow: none;
            }
            .exam-container {
                padding-top: 0;
            }
        }

        /* ========== تخصيص SurveyJS ========== */
        .sd-root-modern {
            direction: rtl !important;
            font-family: inherit !important;
        }

        .sd-container-modern {
            direction: rtl !important;
        }

        .sd-title {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            text-align: center !important;
            margin-bottom: 1rem !important;
        }

        .sd-description {
            text-align: center !important;
            color: var(--text-muted) !important;
        }

        .sd-page {
            padding: 1.5rem !important;
        }

        .sd-question {
            padding: 1.25rem !important;
            margin-bottom: 1rem !important;
            border-radius: 12px !important;
            background: var(--background) !important;
            border: 1px solid var(--border) !important;
        }

        .sd-question__title {
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            color: var(--text) !important;
            text-align: right !important;
        }

        .sd-question__description {
            color: var(--text-muted) !important;
            font-size: 0.9rem !important;
        }

        .sd-item {
            direction: rtl !important;
            text-align: right !important;
            padding: 10px 12px !important;
            border-radius: 8px !important;
            margin-bottom: 6px !important;
            transition: background 0.2s !important;
        }

        .sd-item--allowhover:hover {
            background: var(--background) !important;
        }

        .sd-radio__decorator,
        .sd-checkbox__decorator {
            margin-left: 10px !important;
            margin-right: 0 !important;
            border-color: var(--border) !important;
        }

        .sd-item--checked .sd-radio__decorator,
        .sd-item--checked .sd-checkbox__decorator {
            border-color: var(--primary) !important;
            background: var(--primary) !important;
        }

        .sd-btn {
            background: var(--primary) !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 12px 24px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
        }

        .sd-btn:hover {
            background: var(--primary-dark) !important;
        }

        .sd-navigation {
            direction: rtl !important;
            margin-top: 1.5rem !important;
            padding-top: 1.5rem !important;
            border-top: 1px solid var(--border) !important;
        }

        .sd-progress-bar {
            background: var(--border) !important;
            border-radius: 4px !important;
            height: 8px !important;
        }

        .sd-progress-bar__progress {
            background: var(--primary) !important;
        }

        /* ========== تراكب التقديم ========== */
        .submit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .submit-overlay .card {
            max-width: 300px;
        }

        .submit-overlay .card-body {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <!-- التطبيق الرئيسي -->
    <div id="app"></div>

    <script>
        // ========== إعدادات n8n ==========
        const N8N_CONFIG = {
            // غيّر هذه القيم إلى روابط n8n الخاصة بك
            GET_SURVEY_URL: '',  // مثال: 'https://your-n8n.com/webhook/get-survey'
            SUBMIT_EXAM_URL: '', // مثال: 'https://your-n8n.com/webhook/submit-exam'
            
            // أو استخدم الرابط الأساسي
            BASE_URL: ''  // مثال: 'https://your-n8n.com/webhook'
        };

        // استخراج الروابط من الإعدادات
        function getGetSurveyUrl() {
            return N8N_CONFIG.GET_SURVEY_URL || 
                   (N8N_CONFIG.BASE_URL ? `${N8N_CONFIG.BASE_URL}/get-survey` : null);
        }

        function getSubmitUrl() {
            return N8N_CONFIG.SUBMIT_EXAM_URL || 
                   (N8N_CONFIG.BASE_URL ? `${N8N_CONFIG.BASE_URL}/submit-exam` : null);
        }

        // ========== بيانات تجريبية ==========
        const DEMO_SURVEY = {
            title: 'اختبار تجريبي في البرمجة',
            description: 'هذا اختبار تجريبي لاختبار النظام',
            showProgressBar: 'top',
            showTimerPanel: 'top',
            maxTimeToFinish: 600,
            pages: [{
                elements: [
                    {
                        type: 'radiogroup',
                        name: 'question_1',
                        title: 'ما هي لغة البرمجة الأكثر استخداماً لتطوير الويب؟',
                        choices: ['Python', 'JavaScript', 'Java', 'C++'],
                        correctAnswer: 'JavaScript'
                    },
                    {
                        type: 'radiogroup',
                        name: 'question_2',
                        title: 'ما هو ناتج: 2 + 2 * 3؟',
                        choices: ['8', '12', '6', '10'],
                        correctAnswer: '8'
                    },
                    {
                        type: 'checkbox',
                        name: 'question_3',
                        title: 'أي من التالي يعتبر لغة برمجة؟ (اختر كل ما ينطبق)',
                        choices: ['HTML', 'Python', 'CSS', 'JavaScript', 'SQL'],
                        correctAnswer: ['Python', 'JavaScript', 'SQL']
                    },
                    {
                        type: 'radiogroup',
                        name: 'question_4',
                        title: 'ما هي بنية البيانات التي تتبع مبدأ FIFO؟',
                        choices: ['Stack', 'Queue', 'Tree', 'Graph'],
                        correctAnswer: 'Queue'
                    },
                    {
                        type: 'radiogroup',
                        name: 'question_5',
                        title: 'ما هو الأمر لطباعة "Hello" في Python؟',
                        choices: ['echo "Hello"', 'print("Hello")', 'console.log("Hello")', 'printf("Hello")'],
                        correctAnswer: 'print("Hello")'
                    }
                ]
            }]
        };

        const DEMO_CORRECT_ANSWERS = {
            'q_1': { answer: 'JavaScript', points: 1, question: 'ما هي لغة البرمجة الأكثر استخداماً لتطوير الويب?' },
            'q_2': { answer: '8', points: 1, question: 'ما هو ناتج: 2 + 2 * 3?' },
            'q_3': { answer: ['Python', 'JavaScript', 'SQL'], points: 2, question: 'أي من التالي يعتبر لغة برمجة؟ (اختر كل ما ينطبق)' },
            'q_4': { answer: 'Queue', points: 1, question: 'ما هي بنية البيانات التي تتبع مبدأ FIFO?' },
            'q_5': { answer: 'print("Hello")', points: 1, question: 'ما هو الأمر لطباعة "Hello" في Python?' }
        };

        // ========== حالة التطبيق ==========
        let appState = {
            examId: null,
            token: null,
            surveyData: null,
            survey: null,
            studentName: '',
            studentEmail: '',
            startTime: 0,
            timeRemaining: 0,
            timerInterval: null,
            currentView: 'loading', // loading, error, registration, exam, result
            error: null,
            result: null,
            submitting: false
        };

        // ========== أيقونات SVG ==========
        const icons = {
            clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
            fileText: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
            user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
            checkCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
            xCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
            alertCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
            award: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>`,
            loader: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`
        };

        // ========== دوال مساعدة ==========
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                examId: params.get('exam_id') || params.get('exam'),
                token: params.get('token')
            };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ========== عرض الواجهات ==========
        function render() {
            const app = document.getElementById('app');
            
            switch(appState.currentView) {
                case 'loading':
                    app.innerHTML = renderLoading();
                    break;
                case 'error':
                    app.innerHTML = renderError();
                    break;
                case 'registration':
                    app.innerHTML = renderRegistration();
                    break;
                case 'exam':
                    app.innerHTML = renderExam();
                    initSurvey();
                    break;
                case 'result':
                    app.innerHTML = renderResult();
                    break;
            }
        }

        function renderLoading() {
            return `
                <div class="container">
                    <div class="card">
                        <div class="loading-screen">
                            <div class="spinner"></div>
                            <p class="loading-text">جاري تحميل الامتحان...</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderError() {
            return `
                <div class="container">
                    <div class="card">
                        <div class="error-screen">
                            <div class="error-icon">
                                ${icons.alertCircle}
                            </div>
                            <h2 class="error-title">حدث خطأ</h2>
                            <p class="error-message">${appState.error || 'حدث خطأ غير متوقع'}</p>
                            <button class="btn btn-primary" onclick="location.reload()" style="max-width: 200px; margin: 0 auto;">
                                إعادة المحاولة
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRegistration() {
            const surveyData = appState.surveyData;
            return `
                <div class="container">
                    <div class="card">
                        <div class="card-header">
                            <h1>${surveyData.title || 'اختبار'}</h1>
                            ${surveyData.description ? `<p>${surveyData.description}</p>` : ''}
                        </div>
                        <div class="card-body">
                            <div class="info-badges">
                                ${surveyData.maxTimeToFinish ? `
                                    <span class="badge">
                                        ${icons.clock}
                                        المدة: ${Math.floor(surveyData.maxTimeToFinish / 60)} دقيقة
                                    </span>
                                ` : ''}
                                <span class="badge">
                                    ${icons.fileText}
                                    ${surveyData.pages[0]?.elements.length || 0} سؤال
                                </span>
                            </div>
                            
                            <div class="divider"></div>
                            
                            <form class="registration-form" onsubmit="handleStartExam(event)">
                                <div class="form-group">
                                    <label class="form-label">
                                        ${icons.user}
                                        الاسم الكامل <span class="required">*</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        class="form-input" 
                                        id="studentName"
                                        placeholder="أدخل اسمك الكامل"
                                        required
                                    >
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">
                                        البريد الإلكتروني (اختياري)
                                    </label>
                                    <input 
                                        type="email" 
                                        class="form-input" 
                                        id="studentEmail"
                                        placeholder="example@email.com"
                                    >
                                </div>
                                
                                <button type="submit" class="btn btn-primary">
                                    ابدأ الامتحان
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderExam() {
            const showTimer = appState.timeRemaining > 0;
            return `
                ${showTimer ? `
                    <div class="timer-bar">
                        <div class="timer-content">
                            <div class="timer-label">
                                ${icons.clock}
                                <span>الوقت المتبقي:</span>
                            </div>
                            <div class="timer-value" id="timerValue">${formatTime(appState.timeRemaining)}</div>
                        </div>
                        <div class="timer-progress">
                            <div class="timer-progress-bar" id="timerProgress" style="width: 100%"></div>
                        </div>
                    </div>
                ` : ''}
                
                <div class="container ${!showTimer ? 'exam-container no-timer' : 'exam-container'}">
                    <div class="card">
                        <div id="surveyContainer"></div>
                    </div>
                </div>
                
                ${appState.submitting ? `
                    <div class="submit-overlay">
                        <div class="card">
                            <div class="card-body">
                                <div class="spinner"></div>
                                <p class="loading-text">جاري تقديم الامتحان...</p>
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function renderResult() {
            const result = appState.result;
            const passed = result.results.passed;
            const percentage = parseFloat(result.results.percentage);
            
            return `
                <div class="container" style="align-items: flex-start; padding-top: 40px; padding-bottom: 40px;">
                    <div class="card">
                        <div class="result-header ${passed ? 'passed' : 'failed'}">
                            <div class="result-icon">
                                ${passed ? icons.checkCircle : icons.xCircle}
                            </div>
                            <h1 class="result-title">${passed ? 'مبروك! لقد نجحت' : 'للأسف، لم تنجح'}</h1>
                            <p class="result-subtitle">${result.examInfo.title}</p>
                        </div>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value">${percentage}%</div>
                                <div class="stat-label">النسبة المئوية</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${result.results.totalScore}</div>
                                <div class="stat-label">من ${result.results.maxScore}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value success">${result.results.correctCount}</div>
                                <div class="stat-label">إجابات صحيحة</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value error">${result.results.totalQuestions - result.results.correctCount}</div>
                                <div class="stat-label">إجابات خاطئة</div>
                            </div>
                        </div>
                        
                        <div class="questions-details">
                            <h3 class="section-title">
                                ${icons.fileText}
                                تفاصيل الإجابات
                            </h3>
                            ${result.detailedResults.map((item, index) => `
                                <div class="question-item ${item.isCorrect ? 'correct' : (item.studentAnswer === null ? 'unanswered' : 'incorrect')}">
                                    <div class="question-header">
                                        <div class="question-icon">
                                            ${item.isCorrect ? icons.checkCircle : (item.studentAnswer === null ? icons.alertCircle : icons.xCircle)}
                                        </div>
                                        <div class="question-content">
                                            <p class="question-text">${index + 1}. ${item.question}</p>
                                            <p class="question-answer">
                                                <span>إجابتك: </span>
                                                <span class="${item.isCorrect ? 'correct-answer' : 'wrong-answer'}">
                                                    ${item.studentAnswer !== null ? (Array.isArray(item.studentAnswer) ? item.studentAnswer.join(', ') : item.studentAnswer) : 'لم تُجب'}
                                                </span>
                                            </p>
                                            ${!item.isCorrect ? `
                                                <p class="question-answer">
                                                    <span>الإجابة الصحيحة: </span>
                                                    <span class="correct-answer">${Array.isArray(item.correctAnswer) ? item.correctAnswer.join(', ') : item.correctAnswer}</span>
                                                </p>
                                            ` : ''}
                                            <p class="question-points">النقاط: ${item.score} / ${item.maxScore}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="submission-info">
                            <p>معرف التسليم: ${result.submissionId}</p>
                            <p>تاريخ التسليم: ${formatDate(result.submittedAt)}</p>
                        </div>
                        
                        <div class="print-btn">
                            <button class="btn btn-secondary" onclick="window.print()" style="width: 100%;">
                                طباعة التقرير
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ========== تهيئة SurveyJS ==========
        function initSurvey() {
            const survey = new Survey.Model(appState.surveyData);
            survey.locale = 'ar';
            
            survey.onComplete.add(async (sender) => {
                const plainData = sender.getPlainData();
                const answers = {};
                
                plainData.forEach(question => {
                    if (question.value !== null && question.value !== undefined) {
                        const qId = question.name.replace('question_', 'q_');
                        answers[qId] = question.value;
                    }
                });
                
                await submitExam(answers);
            });
            
            appState.survey = survey;
            
            // بدء المؤقت
            if (appState.timeRemaining > 0) {
                startTimer();
            }
            
            // عرض الاستبيان
            survey.render('surveyContainer');
        }

        // ========== المؤقت ==========
        function startTimer() {
            const totalTime = appState.surveyData.maxTimeToFinish;
            
            appState.timerInterval = setInterval(() => {
                appState.timeRemaining--;
                
                const timerValue = document.getElementById('timerValue');
                const timerProgress = document.getElementById('timerProgress');
                
                if (timerValue) {
                    timerValue.textContent = formatTime(appState.timeRemaining);
                    
                    // تحديث اللون
                    timerValue.classList.remove('warning', 'danger');
                    if (appState.timeRemaining <= 60) {
                        timerValue.classList.add('danger');
                    } else if (appState.timeRemaining <= 180) {
                        timerValue.classList.add('warning');
                    }
                }
                
                if (timerProgress) {
                    const percentage = (appState.timeRemaining / totalTime) * 100;
                    timerProgress.style.width = `${percentage}%`;
                }
                
                if (appState.timeRemaining <= 0) {
                    clearInterval(appState.timerInterval);
                    // إرسال تلقائي
                    if (appState.survey) {
                        appState.survey.completeLastPage();
                    }
                }
            }, 1000);
        }

        // ========== جلب بيانات الامتحان ==========
        async function fetchSurvey() {
            const params = getQueryParams();
            
            if (!params.examId || !params.token) {
                appState.error = 'معرف الامتحان والرمز مطلوبان. استخدم: ?exam_id=XXX&token=YYY';
                appState.currentView = 'error';
                render();
                return;
            }
            
            appState.examId = params.examId;
            appState.token = params.token;
            
            const n8nUrl = getGetSurveyUrl();
            
            // الوضع التجريبي
            if (!n8nUrl && params.examId.toUpperCase() === 'DEMO' && params.token === 'DEMO123') {
                appState.surveyData = DEMO_SURVEY;
                appState.currentView = 'registration';
                render();
                return;
            }
            
            // بدون n8n
            if (!n8nUrl) {
                appState.error = 'لم يتم تكوين رابط n8n. للتجربة استخدم: ?exam_id=DEMO&token=DEMO123';
                appState.currentView = 'error';
                render();
                return;
            }
            
            try {
                const response = await fetch(`${n8nUrl}?exam_id=${encodeURIComponent(params.examId)}&token=${encodeURIComponent(params.token)}`);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'فشل في تحميل الامتحان');
                }
                
                const data = await response.json();
                appState.surveyData = data;
                appState.currentView = 'registration';
                render();
                
            } catch (error) {
                console.error('Error fetching survey:', error);
                appState.error = error.message;
                appState.currentView = 'error';
                render();
            }
        }

        // ========== بدء الامتحان ==========
        function handleStartExam(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById('studentName');
            const emailInput = document.getElementById('studentEmail');
            
            appState.studentName = nameInput.value.trim();
            appState.studentEmail = emailInput.value.trim();
            
            if (!appState.studentName) {
                alert('الرجاء إدخال اسمك');
                return;
            }
            
            appState.startTime = Date.now();
            
            if (appState.surveyData.maxTimeToFinish) {
                appState.timeRemaining = appState.surveyData.maxTimeToFinish;
            }
            
            appState.currentView = 'exam';
            render();
        }

        // ========== تقديم الامتحان ==========
        async function submitExam(answers) {
            appState.submitting = true;
            render();
            
            const timeSpent = Math.floor((Date.now() - appState.startTime) / 1000);
            
            const payload = {
                exam: appState.examId,
                token: appState.token,
                answers: answers,
                studentName: appState.studentName,
                studentEmail: appState.studentEmail || null,
                timeSpent: timeSpent,
                finishedAt: new Date().toISOString()
            };
            
            const n8nUrl = getSubmitUrl();
            
            // الوضع التجريبي
            if (!n8nUrl) {
                const result = calculateDemoResult(answers, timeSpent);
                appState.result = result;
                appState.submitting = false;
                appState.currentView = 'result';
                
                if (appState.timerInterval) {
                    clearInterval(appState.timerInterval);
                }
                
                render();
                return;
            }
            
            try {
                const response = await fetch(n8nUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'فشل في تقديم الامتحان');
                }
                
                const result = await response.json();
                appState.result = result;
                appState.currentView = 'result';
                
            } catch (error) {
                console.error('Error submitting exam:', error);
                alert('حدث خطأ أثناء تقديم الامتحان: ' + error.message);
                appState.submitting = false;
            }
            
            if (appState.timerInterval) {
                clearInterval(appState.timerInterval);
            }
            
            render();
        }

        // ========== حساب النتيجة التجريبية ==========
        function calculateDemoResult(answers, timeSpent) {
            let totalScore = 0;
            let maxScore = 0;
            let correctCount = 0;
            const detailedResults = [];
            
            for (const [qId, correctData] of Object.entries(DEMO_CORRECT_ANSWERS)) {
                const studentAnswer = answers[qId];
                maxScore += correctData.points;
                
                const isMultipleChoice = Array.isArray(correctData.answer);
                let isCorrect = false;
                
                if (studentAnswer !== undefined && studentAnswer !== null) {
                    if (isMultipleChoice) {
                        const studentAnswers = Array.isArray(studentAnswer) ? studentAnswer : [studentAnswer];
                        const correctAnswers = correctData.answer;
                        isCorrect = correctAnswers.length === studentAnswers.length &&
                            correctAnswers.every(a => studentAnswers.includes(a));
                    } else {
                        isCorrect = studentAnswer === correctData.answer;
                    }
                }
                
                if (isCorrect) {
                    totalScore += correctData.points;
                    correctCount++;
                }
                
                detailedResults.push({
                    questionId: qId.replace('q_', ''),
                    question: correctData.question,
                    studentAnswer: studentAnswer ?? null,
                    correctAnswer: correctData.answer,
                    isCorrect: isCorrect,
                    score: isCorrect ? correctData.points : 0,
                    maxScore: correctData.points,
                    type: isMultipleChoice ? 'checkbox' : 'radiogroup'
                });
            }
            
            const percentage = maxScore > 0 ? ((totalScore / maxScore) * 100).toFixed(2) : '0';
            const passed = parseFloat(percentage) >= 60;
            
            return {
                success: true,
                submissionId: `DEMO_${appState.examId}_${Date.now()}`,
                examId: appState.examId,
                studentName: appState.studentName,
                studentEmail: appState.studentEmail,
                examInfo: {
                    title: appState.surveyData.title,
                    duration: Math.floor((appState.surveyData.maxTimeToFinish || 0) / 60)
                },
                results: {
                    totalScore: totalScore,
                    maxScore: maxScore,
                    percentage: percentage,
                    correctCount: correctCount,
                    totalQuestions: Object.keys(DEMO_CORRECT_ANSWERS).length,
                    passed: passed,
                    grade: passed ? 'Pass' : 'Fail'
                },
                detailedResults: detailedResults,
                timeSpent: timeSpent,
                submittedAt: new Date().toISOString(),
                finishedAt: new Date().toISOString()
            };
        }

        // ========== بدء التطبيق ==========
        document.addEventListener('DOMContentLoaded', () => {
            fetchSurvey();
        });
    </script>
</body>
</html>
