<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام اختبارات احترافي">
    <title>نظام الاختبارات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SurveyJS Libraries (Knockout Version for full compatibility) -->
    <script src="https://unpkg.com/knockout@3.5.1/build/output/knockout-latest.js"></script>
    <script src="https://unpkg.com/survey-knockout@1.9.120/survey.ko.min.js"></script>
    <link href="https://unpkg.com/survey-knockout@1.9.120/survey.css" rel="stylesheet"/>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Light Mode */
        :root {
            --bg-primary: #ffffff; /* تم التغيير إلى أبيض */
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc; /* رمادي فاتح جداً للعناصر الداخلية */
            --text-primary: #1e3a8a; /* أزرق ملكي للعناوين */
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent: #1e3a8a; /* أزرق ملكي */
            --accent-hover: #1d4ed8;
            --accent-light: rgba(30, 58, 138, 0.08);
            --border: #e2e8f0;
            --shadow: rgba(30, 58, 138, 0.06);
            --success: #059669;
            --danger: #dc2626;
        }
        
        /* Dark Mode */
        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: rgba(59, 130, 246, 0.15);
            --border: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
            --success: #34d399;
            --danger: #f87171;
        }
        
        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-secondary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Card Style */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }
        
        /* Loading Spinner */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Timer */
        .timer-ring { transform: rotate(-90deg); }
        .timer-ring-bg { stroke: var(--border); }
        .timer-ring-progress { stroke: var(--accent); transition: stroke-dashoffset 1s linear; }
        .timer-warning .timer-ring-progress { stroke: var(--danger); }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Score Circle */
        .score-circle { position: relative; width: 140px; height: 140px; }
        .score-circle svg { transform: rotate(-90deg); }
        .score-circle-bg { fill: none; stroke: var(--border); stroke-width: 10; }
        .score-circle-progress { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.2s ease; }
        .score-value { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Theme Toggle */
        .theme-toggle {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: var(--accent-light); border-color: var(--accent); }
        .theme-toggle i { color: var(--text-secondary); font-size: 1rem; }
        
        /* SurveyJS Custom Styles */
        .sd-root-modern {
            --primary: var(--accent) !important;
            --primary-light: var(--accent-light) !important;
            --background: var(--bg-secondary) !important;
            --background-dim: var(--bg-tertiary) !important;
            --foreground: var(--text-primary) !important;
            --foreground-light: var(--text-secondary) !important;
            --border: var(--border) !important;
            --corner-radius: 10px !important;
            font-family: 'Cairo', sans-serif !important;
        }
        
        .sd-root-modern .sd-title { color: var(--text-primary) !important; font-weight: 700 !important; }
        .sd-root-modern .sd-question__title { font-weight: 600 !important; color: var(--text-primary) !important; font-size: 1.05rem !important; line-height: 1.6 !important; }
        
        .sd-root-modern .sd-item {
            background: var(--bg-tertiary) !important;
            border: 2px solid var(--border) !important;
            border-radius: 10px !important;
            padding: 12px 16px !important;
            margin-bottom: 8px !important;
            transition: all 0.2s ease !important;
        }
        .sd-root-modern .sd-item:hover { border-color: var(--accent) !important; }
        .sd-root-modern .sd-item--checked { border-color: var(--accent) !important; background: var(--accent-light) !important; }
        .sd-root-modern .sd-item__control-label { color: var(--text-primary) !important; font-family: 'Cairo', sans-serif !important; }
        
        .sd-root-modern .sd-btn {
            background: var(--accent) !important;
            color: white !important;
            font-family: 'Cairo', sans-serif !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            padding: 10px 24px !important;
            border: none !important;
            transition: all 0.2s ease !important;
        }
        .sd-root-modern .sd-btn:hover { background: var(--accent-hover) !important; transform: translateY(-1px); }
        .sd-root-modern .sd-navigation__complete-btn { background: var(--success) !important; }
        
        .sd-root-modern .sd-body, .sd-root-modern .sd-page, .sd-root-modern .sd-panel { background: transparent !important; }
        .sd-root-modern .sd-question { padding: 0 !important; }
        .sd-root-modern .sd-selectbase { padding: 0 !important; border: none !important; }
        
        .sd-root-modern .sd-progress-buttons { background: var(--bg-tertiary) !important; border-radius: 10px !important; padding: 8px !important; }
        .sd-root-modern pre { background: var(--bg-primary) !important; border-radius: 8px !important; padding: 14px !important; direction: ltr !important; text-align: left !important; font-family: 'JetBrains Mono', monospace !important; }
        
        /* Stat Card */
        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="card fixed top-0 left-0 right-0 z-50 rounded-none border-t-0 border-l-0 border-r-0">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--accent);">
                    <i class="fas fa-graduation-cap text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold" style="color: var(--text-primary);">نظام الاختبارات</h1>
                    <p id="header-subtitle" class="text-xs" style="color: var(--text-muted);">اللوحة الرئيسية</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Timer -->
                <div id="timer-wrapper" class="hidden">
                    <div id="timer-container" class="flex items-center gap-2 px-3 py-2 rounded-lg" style="background: var(--bg-tertiary); border: 1px solid var(--border);">
                        <svg class="timer-ring" width="32" height="32">
                            <circle class="timer-ring-bg" stroke-width="3" fill="transparent" r="13" cx="16" cy="16"/>
                            <circle id="timer-progress" class="timer-ring-progress" stroke-width="3" fill="transparent" r="13" cx="16" cy="16" stroke-dasharray="81.7" stroke-dashoffset="0" stroke-linecap="round"/>
                        </svg>
                        <div class="text-right">
                            <div id="timer-display" class="text-base font-bold font-mono" style="color: var(--text-primary);">00:00</div>
                        </div>
                    </div>
                </div>
                
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="theme-toggle" aria-label="تبديل السمة">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 container mx-auto px-4 pt-24 pb-8 min-h-screen">
        
        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center min-h-[70vh]">
            <div class="card p-8 text-center fade-in max-w-md w-full">
                <div class="spinner mx-auto mb-4"></div>
                <h2 class="text-lg font-bold mb-1" style="color: var(--text-primary);">جاري تحميل الاختبار</h2>
                <p id="loading-message" style="color: var(--text-secondary);">يرجى الانتظار...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden">
            <div class="max-w-lg mx-auto card p-8 text-center fade-in">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5" style="background: rgba(220, 38, 38, 0.1);">
                    <i class="fas fa-exclamation-triangle text-3xl" style="color: var(--danger);"></i>
                </div>
                <h2 class="text-xl font-bold mb-2" style="color: var(--text-primary);">حدث خطأ</h2>
                <p id="error-message" class="mb-5" style="color: var(--text-secondary);"></p>
                <button onclick="location.reload()" class="px-6 py-2 rounded-lg font-semibold text-white" style="background: var(--accent);">
                    <i class="fas fa-redo ml-2"></i>
                    إعادة المحاولة
                </button>
            </div>
        </div>

        <!-- Survey Container -->
        <div id="survey-wrapper" class="hidden">
            <!-- Exam Info -->
            <div id="exam-info" class="card p-4 mb-4 fade-in">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 id="exam-title" class="text-lg font-bold" style="color: var(--text-primary);"></h2>
                        <p id="exam-description" class="text-sm" style="color: var(--text-secondary);"></p>
                    </div>
                    <div class="flex items-center gap-5">
                        <div class="text-center">
                            <div id="questions-count" class="text-xl font-bold" style="color: var(--accent);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">سؤال</div>
                        </div>
                        <div class="text-center">
                            <div id="duration-display" class="text-xl font-bold" style="color: var(--accent);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">دقيقة</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SurveyJS -->
            <div class="card p-5 fade-in">
                <div id="surveyContainer"></div>
            </div>
        </div>

        <!-- Submitting State -->
        <div id="submitting-state" class="hidden">
            <div class="flex flex-col items-center justify-center min-h-[70vh]">
                <div class="card p-8 text-center fade-in max-w-md w-full">
                    <div class="spinner mx-auto mb-4"></div>
                    <h2 class="text-lg font-bold mb-1" style="color: var(--text-primary);">جاري تصحيح الإجابات</h2>
                    <p style="color: var(--text-secondary);">يرجى الانتظار...</p>
                </div>
            </div>
        </div>

        <!-- Success State -->
        <div id="success-state" class="hidden">
            <div class="max-w-xl mx-auto">
                <div class="card p-6 text-center fade-in">
                    <div id="result-icon" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center"></div>
                    <h2 id="result-title" class="text-2xl font-bold mb-1" style="color: var(--text-primary);"></h2>
                    <p id="result-message" class="mb-6" style="color: var(--text-secondary);"></p>

                    <!-- Score Circle -->
                    <div class="flex justify-center mb-6">
                        <div class="score-circle">
                            <svg width="140" height="140" viewBox="0 0 140 140">
                                <circle class="score-circle-bg" cx="70" cy="70" r="60"/>
                                <circle id="score-progress" class="score-circle-progress" cx="70" cy="70" r="60"/>
                            </svg>
                            <div class="score-value">
                                <span id="score-percentage" class="text-3xl font-black" style="color: var(--text-primary);">0%</span>
                                <span class="text-xs" style="color: var(--text-muted);">النتيجة</span>
                            </div>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div class="stat-card">
                            <div id="score-value" class="text-2xl font-bold" style="color: var(--accent);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">درجتك</div>
                        </div>
                        <div class="stat-card">
                            <div id="max-value" class="text-2xl font-bold" style="color: var(--success);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">الكاملة</div>
                        </div>
                        <div class="stat-card">
                            <div id="time-spent" class="text-2xl font-bold" style="color: var(--text-secondary);">0</div>
                            <div class="text-xs" style="color: var(--text-muted);">دقيقة</div>
                        </div>
                    </div>

                    <div class="flex justify-center">
                        <button onclick="window.print()" class="px-6 py-2 rounded-lg font-semibold" style="background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border);">
                            <i class="fas fa-print ml-2"></i>
                            طباعة النتيجة
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 card mt-8 rounded-none border-b-0 border-l-0 border-r-0 py-3">
        <div class="container mx-auto px-4 text-center">
            <p class="text-xs" style="color: var(--text-muted);">نظام الاختبارات الاحترافي - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        // ===== Configuration =====
        const CONFIG = {
            BASE_URL: 'https://n8n.srv1332143.hstgr.cloud/webhook',
            ENDPOINTS: {
                GET_SURVEY: '/get-survey',
                SUBMIT_EXAM: '/submit-exam'
            }
        };

        // ===== State =====
        const state = {
            examId: '',
            examToken: '',
            timeLimit: 0,
            startTime: null,
            timerInterval: null,
            survey: null,
            examData: null,
            isDark: false
        };

        // ===== DOM Elements =====
        const DOM = {
            loadingState: document.getElementById('loading-state'),
            loadingMessage: document.getElementById('loading-message'),
            errorState: document.getElementById('error-state'),
            errorMessage: document.getElementById('error-message'),
            surveyWrapper: document.getElementById('survey-wrapper'),
            surveyContainer: document.getElementById('surveyContainer'),
            submittingState: document.getElementById('submitting-state'),
            successState: document.getElementById('success-state'),
            timerWrapper: document.getElementById('timer-wrapper'),
            timerContainer: document.getElementById('timer-container'),
            timerDisplay: document.getElementById('timer-display'),
            timerProgress: document.getElementById('timer-progress'),
            examTitle: document.getElementById('exam-title'),
            examDescription: document.getElementById('exam-description'),
            questionsCount: document.getElementById('questions-count'),
            durationDisplay: document.getElementById('duration-display'),
            headerSubtitle: document.getElementById('header-subtitle'),
            themeToggle: document.getElementById('theme-toggle'),
            themeIcon: document.getElementById('theme-icon')
        };

        // ===== Initialize =====
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            initExam();
        });

        // ===== Theme =====
        function initTheme() {
            const savedTheme = localStorage.getItem('quiz-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            state.isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
            applyTheme();
            
            DOM.themeToggle.addEventListener('click', toggleTheme);
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            localStorage.setItem('quiz-theme', state.isDark ? 'dark' : 'light');
            applyTheme();
        }

        function applyTheme() {
            if (state.isDark) {
                document.documentElement.classList.add('dark');
                DOM.themeIcon.className = 'fas fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                DOM.themeIcon.className = 'fas fa-moon';
            }
        }

        // ===== Exam =====
        async function initExam() {
            const params = getUrlParams();
            
            if (!params.examId || !params.examToken) {
                showError('معرف الاختبار أو الرمز مفقود', 'تأكد من أن الرابط صحيح');
                return;
            }

            state.examId = params.examId;
            state.examToken = params.examToken;

            await loadSurveyData();
        }

        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                examId: urlParams.get('exam') || urlParams.get('exam_id'),
                examToken: urlParams.get('token')
            };
        }

        async function loadSurveyData() {
            try {
                DOM.loadingMessage.textContent = 'جاري الاتصال بالخادم...';
                
                const response = await fetch(
                    `${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.GET_SURVEY}?exam=${state.examId}&token=${state.examToken}`,
                    {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    }
                );

                if (!response.ok) {
                    throw new Error('خطأ في الاتصال (' + response.status + ')');
                }

                const data = await response.json();
                if (data.error || data.success === false) {
                    throw new Error(data.message || data.error || 'فشل في تحميل الاختبار');
                }

                state.examData = data;
                initializeExam(data);

            } catch (error) {
                console.error('Load Error:', error);
                showError('فشل الاتصال بالخادم', error.message);
            }
        }

        function initializeExam(data) {
            DOM.examTitle.textContent = data.title || 'اختبار';
            DOM.headerSubtitle.textContent = data.title || 'نظام الاختبارات';
            DOM.examDescription.textContent = data.description || '';
            
            // معالجة البيانات: تقسيم الأسئلة لصفحات منفصلة لظهور الأزرار
            if (data.pages && data.pages.length === 1 && data.pages[0].elements && data.pages[0].elements.length > 1) {
               const questions = data.pages[0].elements;
               const newPages = questions.map((q, index) => ({
                 name: "page" + index,
                 elements: [q]
               }));
               data.pages = newPages;
            }

            const questionsLength = data.pages?.reduce((acc, page) => acc + (page.elements?.length || 0), 0) || 0;
            DOM.questionsCount.textContent = questionsLength;
            
            const durationMin = parseInt(data.durationMin || data.duration_min || 15);
            DOM.durationDisplay.textContent = durationMin;
            
            state.timeLimit = durationMin * 60;
            state.startTime = Date.now();

            initializeSurvey(data);
            startTimer();

            DOM.loadingState.classList.add('hidden');
            DOM.surveyWrapper.classList.remove('hidden');
            DOM.timerWrapper.classList.remove('hidden');
        }

        function initializeSurvey(surveyJSON) {
            Survey.surveyLocalization.currentLocale = 'ar';
            state.survey = new Survey.Model(surveyJSON);

            state.survey.onComplete.add(function(sender) {
                submitExam(sender.data);
            });

            // استخدام render للمكتبة الصحيحة (Knockout)
            state.survey.render(DOM.surveyContainer);
        }

        // ===== Timer =====
        function startTimer() {
            updateTimerDisplay();
            
            state.timerInterval = setInterval(function() {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                const remaining = Math.max(0, state.timeLimit - elapsed);

                updateTimerDisplay(remaining);
                updateTimerProgress(remaining);

                if (remaining <= 60) {
                    DOM.timerContainer.classList.add('timer-warning');
                }

                if (remaining <= 0) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                    if (state.survey) {
                        state.survey.completeLastPage();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay(remaining) {
            if (typeof remaining === 'undefined') {
                remaining = state.timeLimit;
            }
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            DOM.timerDisplay.textContent = mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
        }

        function updateTimerProgress(remaining) {
            const progress = remaining / state.timeLimit;
            const circumference = 2 * Math.PI * 13;
            const offset = circumference * (1 - progress);
            DOM.timerProgress.style.strokeDashoffset = offset;
        }

        // ===== Submit =====
        async function submitExam(answers) {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            DOM.surveyWrapper.classList.add('hidden');
            DOM.timerWrapper.classList.add('hidden');
            DOM.submittingState.classList.remove('hidden');

            try {
                const response = await fetch(`${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.SUBMIT_EXAM}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam: state.examId,
                        token: state.examToken,
                        answers: answers,
                        finishedAt: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error('خطأ في إرسال الإجابات');
                }

                const result = await response.json();
                showSuccess(result);

            } catch (error) {
                console.error('Submit Error:', error);
                // عرض النجاح حتى لو فشل الإرسال لتجنب تعليق المستخدم
                showSuccess({ score: 0, max: 0 });
            }
        }

        // ===== UI States =====
        function showError(title, message) {
            DOM.loadingState.classList.add('hidden');
            DOM.errorState.classList.remove('hidden');
            document.querySelector('#error-state h2').textContent = title;
            DOM.errorMessage.textContent = message;
        }

        function showSuccess(result) {
            DOM.submittingState.classList.add('hidden');
            DOM.successState.classList.remove('hidden');

            const score = result.score || 0;
            const max = result.max || 100;
            const percentage = max > 0 ? Math.round((score / max) * 100) : 0;
            const timeSpent = state.startTime ? Math.round((Date.now() - state.startTime) / 60000) : 0;

            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');

            if (percentage >= 80) {
                resultIcon.innerHTML = '<i class="fas fa-trophy text-4xl" style="color: #f59e0b;"></i>';
                resultIcon.style.background = 'rgba(245, 158, 11, 0.15)';
                resultTitle.textContent = 'ممتاز!';
                resultMessage.textContent = 'أداء رائع! أنت متقدم';
                celebrateSuccess();
            } else if (percentage >= 60) {
                resultIcon.innerHTML = '<i class="fas fa-thumbs-up text-4xl" style="color: var(--success);"></i>';
                resultIcon.style.background = 'rgba(5, 150, 105, 0.15)';
                resultTitle.textContent = 'جيد!';
                resultMessage.textContent = 'أداء جيد! استمر في التعلم';
            } else {
                resultIcon.innerHTML = '<i class="fas fa-book text-4xl" style="color: var(--text-secondary);"></i>';
                resultIcon.style.background = 'var(--bg-tertiary)';
                resultTitle.textContent = 'حاول مرة أخرى';
                resultMessage.textContent = 'تحتاج لمزيد من المراجعة';
            }

            document.getElementById('score-value').textContent = score;
            document.getElementById('max-value').textContent = max;
            document.getElementById('time-spent').textContent = timeSpent;
            document.getElementById('score-percentage').textContent = percentage + '%';

            setTimeout(function() {
                const circleProgress = document.getElementById('score-progress');
                if (circleProgress) {
                    const circumference = 2 * Math.PI * 60;
                    const offset = circumference - (percentage / 100) * circumference;
                    circleProgress.style.strokeDashoffset = offset;
                }
            }, 100);
        }

        function celebrateSuccess() {
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#1e3a8a', '#059669', '#f59e0b'] // ألوان متوافقة مع الأزرق الملكي
                });
            }
        }
    </script>
</body>
</html>
