<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام اختبارات بايثون الاحترافي">
    <title>نظام اختبارات بايثون</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/survey-core@1.9.110/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@1.9.110/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-jquery@1.9.110/survey.jquery.min.js"></script>
    <link href="https://unpkg.com/survey-core@1.9.110/defaultV2.min.css" rel="stylesheet"/>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        secondary: '#1e293b',
                        accent: '#f59e0b',
                        surface: '#334155',
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg: #0f172a;
            --fg: #f8fafc;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --card: rgba(30, 41, 59, 0.9);
            --border: rgba(148, 163, 184, 0.15);
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * {
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .mesh-gradient {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: floatMesh 25s infinite ease-in-out;
        }
        
        .mesh-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, transparent 70%);
            top: -150px;
            right: -100px;
        }
        
        .mesh-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
            bottom: -100px;
            left: -50px;
            animation-delay: -8s;
        }
        
        .mesh-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
            top: 40%;
            left: 30%;
            animation-delay: -15s;
        }
        
        @keyframes floatMesh {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(30px, 20px) scale(1.02); }
        }
        
        /* Grid Pattern */
        .grid-pattern {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        
        /* Glass Effect */
        .glass {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }
        
        /* Loading Spinner */
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Timer Styles */
        .timer-container {
            position: relative;
            padding: 16px 24px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .timer-container.warning {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
            animation: timerPulse 1s infinite;
        }
        
        @keyframes timerPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
            50% { box-shadow: 0 0 25px 5px rgba(239, 68, 68, 0.25); }
        }
        
        /* Progress Ring */
        .progress-ring {
            transform: rotate(-90deg);
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.5s ease;
        }
        
        /* Fade In Animation */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Custom SurveyJS Styling */
        .sd-root-modern {
            --primary: #f59e0b !important;
            --primary-light: #fbbf24 !important;
            --primary-dark: #d97706 !important;
            --background: rgba(15, 23, 42, 0) !important;
            --background-dim: rgba(30, 41, 59, 0.5) !important;
            --foreground: #f8fafc !important;
            --foreground-light: #94a3b8 !important;
            --border: rgba(148, 163, 184, 0.2) !important;
            --corner-radius: 12px !important;
        }
        
        .sd-root-modern .sd-title {
            color: var(--fg) !important;
            font-family: 'Cairo', sans-serif !important;
        }
        
        .sd-root-modern .sd-description {
            color: var(--muted) !important;
        }
        
        .sd-root-modern .sd-page__title {
            color: var(--fg) !important;
        }
        
        .sd-root-modern .sd-question__title {
            color: var(--fg) !important;
            font-family: 'Cairo', sans-serif !important;
            font-weight: 600 !important;
        }
        
        .sd-root-modern .sd-item__control-label {
            color: var(--fg) !important;
        }
        
        .sd-root-modern .sd-item {
            background: rgba(51, 65, 85, 0.4) !important;
            border: 2px solid var(--border) !important;
            border-radius: 14px !important;
            padding: 16px 20px !important;
            margin-bottom: 12px !important;
            transition: all 0.3s ease !important;
        }
        
        .sd-root-modern .sd-item:hover {
            background: rgba(51, 65, 85, 0.6) !important;
            border-color: var(--accent) !important;
        }
        
        .sd-root-modern .sd-item--checked {
            background: rgba(245, 158, 11, 0.15) !important;
            border-color: var(--accent) !important;
        }
        
        .sd-root-modern .sd-item__decorator {
            display: none !important;
        }
        
        .sd-root-modern .sd-checkbox__control:focus + .sd-checkbox__decorator,
        .sd-root-modern .sd-radio__control:focus + .sd-radio__decorator {
            outline: 2px solid var(--accent) !important;
        }
        
        .sd-root-modern .sd-btn {
            background: linear-gradient(135deg, var(--accent), #d97706) !important;
            color: var(--bg) !important;
            font-weight: 700 !important;
            border-radius: 14px !important;
            padding: 14px 32px !important;
            border: none !important;
            transition: all 0.3s ease !important;
        }
        
        .sd-root-modern .sd-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3) !important;
        }
        
        .sd-root-modern .sd-navigation__complete-btn {
            background: linear-gradient(135deg, #10b981, #059669) !important;
        }
        
        .sd-root-modern .sd-progress-buttons {
            background: rgba(30, 41, 59, 0.5) !important;
            border-radius: 12px !important;
            padding: 12px !important;
        }
        
        .sd-root-modern .sd-progress-buttons__list li {
            color: var(--muted) !important;
        }
        
        .sd-root-modern .sd-progress-buttons__list li--passed {
            color: var(--success) !important;
        }
        
        .sd-root-modern .sd-progress-buttons__page-title {
            color: var(--fg) !important;
        }
        
        .sd-root-modern .sd-panel {
            background: transparent !important;
            border: none !important;
        }
        
        .sd-root-modern .sd-question {
            background: transparent !important;
            padding: 0 !important;
        }
        
        .sd-root-modern .sd-selectbase {
            border: none !important;
            padding: 0 !important;
        }
        
        .sd-root-modern .sd-body {
            background: transparent !important;
        }
        
        .sd-root-modern .sd-page {
            background: transparent !important;
        }
        
        /* Code Block in Survey */
        .sd-root-modern pre {
            background: #0d1117 !important;
            border-radius: 12px !important;
            padding: 16px !important;
            direction: ltr !important;
            text-align: left !important;
            font-family: 'JetBrains Mono', monospace !important;
            overflow-x: auto !important;
        }
        
        /* Score Card */
        .score-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(51, 65, 85, 0.5));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .score-card:hover {
            transform: translateY(-5px);
            border-color: rgba(245, 158, 11, 0.3);
        }
        
        .score-value {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--surface);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="antialiased text-slate-100">

    </div>

    <script>
        // Configuration
        const CONFIG = {
            BASE_URL: 'https://n8n.srv1332143.hstgr.cloud/webhook',
            ENDPOINTS: {
                GET_SURVEY: '/get-survey',
                SUBMIT_EXAM: '/submit-exam'
            }
        };

        // State Management
        const state = {
            examId: '',
            examToken: '',
            timeLimit: 0,
            startTime: null,
            timerInterval: null,
            survey: null,
            examData: null
        };

        // DOM Elements
        const DOM = {
            loadingState: document.getElementById('loading-state'),
            loadingMessage: document.getElementById('loading-message'),
            errorState: document.getElementById('error-state'),
            errorMessage: document.getElementById('error-message'),
            surveyWrapper: document.getElementById('survey-wrapper'),
            surveyContainer: document.getElementById('surveyContainer'),
            submittingState: document.getElementById('submitting-state'),
            successState: document.getElementById('success-state'),
            timerWrapper: document.getElementById('timer-wrapper'),
            timerDisplay: document.getElementById('timer-display'),
            timerProgress: document.getElementById('timer-progress'),
            examTitle: document.getElementById('exam-title'),
            examDescription: document.getElementById('exam-description'),
            questionsCount: document.getElementById('questions-count'),
            durationDisplay: document.getElementById('duration-display'),
            headerSubtitle: document.getElementById('header-subtitle')
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            const params = getUrlParams();
            
            if (!params.examId || !params.examToken) {
                showError('معرف الاختبار أو الرمز مفقود في الرابط', 'تأكد من أن الرابط صحيح ومكتمل');
                return;
            }

            state.examId = params.examId;
            state.examToken = params.examToken;

            await loadSurveyData();
        }

        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                examId: urlParams.get('exam') || urlParams.get('exam_id'),
                examToken: urlParams.get('token')
            };
        }

        async function loadSurveyData() {
            try {
                DOM.loadingMessage.textContent = 'جاري الاتصال بخادم الاختبارات...';
                
                const response = await fetch(
                    `${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.GET_SURVEY}?exam=${state.examId}&token=${state.examToken}`,
                    {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    }
                );

                if (!response.ok) {
                    throw new Error(`خطأ في الاتصال: ${response.status}`);
                }

                const data = await response.json();

                if (data.success === false) {
                    throw new Error(data.message || 'فشل في تحميل الاختبار');
                }

                state.examData = data;
                initializeExam(data);

            } catch (error) {
                console.error('Load Error:', error);
                showError('فشل الاتصال بالخادم', error.message);
            }
        }

        function initializeExam(data) {
            // Setup exam info
            DOM.examTitle.textContent = data.title || 'اختبار جديد';
            DOM.headerSubtitle.textContent = data.title || 'نظام الاختبارات الاحترافي';
            DOM.examDescription.textContent = data.description || '';
            
            const questionsLength = data.pages?.[0]?.elements?.length || 0;
            DOM.questionsCount.textContent = questionsLength;
            
            const durationMin = data.durationMin || data.duration_min || 15;
            DOM.durationDisplay.textContent = durationMin;
            
            state.timeLimit = durationMin * 60;
            state.startTime = Date.now();

            // Initialize SurveyJS
            initializeSurvey(data);

            // Start Timer
            startTimer();

            // Show survey
            DOM.loadingState.classList.add('hidden');
            DOM.surveyWrapper.classList.remove('hidden');
            DOM.timerWrapper.classList.remove('hidden');
        }

        function initializeSurvey(surveyJSON) {
            // Set Arabic locale
            Survey.surveyLocalization.currentLocale = 'ar';
            
            // Create survey model
            state.survey = new Survey.Model(surveyJSON);

            // Apply custom theme
            applySurveyTheme();

            // On complete handler
            state.survey.onComplete.add((sender) => {
                submitExam(sender.data);
            });

            // Render survey
            document.getElementById('surveyContainer').appendChild(state.survey.render());
        }

        function applySurveyTheme() {
            // Custom theme is applied via CSS
        }

        function startTimer() {
            updateTimerDisplay();
            
            state.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                const remaining = Math.max(0, state.timeLimit - elapsed);

                updateTimerDisplay(remaining);
                updateTimerProgress(remaining);

                if (remaining <= 60) {
                    DOM.timerWrapper.querySelector('.timer-container').classList.add('warning');
                }

                if (remaining <= 0) {
                    clearInterval(state.timerInterval);
                    if (state.survey) {
                        state.survey.completeLastPage();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay(remaining = null) {
            if (remaining === null) {
                remaining = state.timeLimit;
            }
            
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            DOM.timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerProgress(remaining) {
            const progress = remaining / state.timeLimit;
            const circumference = 2 * Math.PI * 17;
            const offset = circumference * (1 - progress);
            DOM.timerProgress.style.strokeDashoffset = offset;
            
            // Change color when low time
            if (remaining <= 60) {
                DOM.timerProgress.style.stroke = '#ef4444';
            } else if (remaining <= 300) {
                DOM.timerProgress.style.stroke = '#f59e0b';
            } else {
                DOM.timerProgress.style.stroke = '#10b981';
            }
        }

        async function submitExam(answers) {
            // Clear timer
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
            }

            // Show submitting state
            DOM.surveyWrapper.classList.add('hidden');
            DOM.timerWrapper.classList.add('hidden');
            DOM.submittingState.classList.remove('hidden');

            try {
                const response = await fetch(`${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.SUBMIT_EXAM}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam: state.examId,
                        token: state.examToken,
                        answers: answers,
                        finishedAt: new Date().toISOString()
                    })
                });

                const result = await response.json();
                showSuccess(result);

            } catch (error) {
                console.error('Submit Error:', error);
                showSuccess({
                    score: 0,
                    max: 0,
                    message: 'تم حفظ إجاباتك محلياً، لكن حدث خطأ في الاتصال'
                });
            }
        }

        function showError(title, message) {
            DOM.loadingState.classList.add('hidden');
            DOM.errorState.classList.remove('hidden');
            
            document.querySelector('#error-state h2').textContent = title;
            DOM.errorMessage.textContent = message;
        }

        function showSuccess(result) {
            DOM.submittingState.classList.add('hidden');
            DOM.successState.classList.remove('hidden');

            const score = result.score || 0;
            const max = result.max || 100;
            const percentage = max > 0 ? Math.round((score / max) * 100) : 0;

            // Result icon and title based on score
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');

            if (percentage >= 80) {
                resultIcon.innerHTML = '<span class="text-6xl">🏆</span>';
                resultIcon.className = 'w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-amber-400 to-amber-600';
                resultTitle.textContent = 'ممتاز!';
                resultMessage.textContent = 'أداء رائع! أنت متقدم في بايثون';
                celebrateSuccess();
            } else if (percentage >= 60) {
                resultIcon.innerHTML = '<span class="text-6xl">👍</span>';
                resultIcon.className = 'w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-emerald-400 to-emerald-600';
                resultTitle.textContent = 'جيد!';
                resultMessage.textContent = 'أداء جيد! استمر في التعلم';
            } else {
                resultIcon.innerHTML = '<span class="text-6xl">📚</span>';
                resultIcon.className = 'w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-gradient-to-br from-slate-500 to-slate-600';
                resultTitle.textContent = 'حاول مرة أخرى';
                resultMessage.textContent = 'تحتاج لمزيد من المراجعة';
            }

            // Animate score
            document.getElementById('score-value').textContent = score;
            document.getElementById('max-value').textContent = max;
            document.getElementById('percentage-value').textContent = percentage + '%';
            
            // Animate percentage bar
            setTimeout(() => {
                document.getElementById('percentage-bar').style.width = percentage + '%';
            }, 300);
        }

        function celebrateSuccess() {
            // Fire confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6']
            });

            // Second burst
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f59e0b', '#10b981']
                });
                confetti({
                    particleCount: 50,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f59e0b', '#10b981']
                });
            }, 250);
        }
    </script>
</body>
</html>
