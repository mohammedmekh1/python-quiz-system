<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات المتقدم</title>

  <!-- الخطوط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- مكتبة Confetti للاحتفال بالإنجاز -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- SurveyJS Libraries (النسخة الصحيحة التي تعمل) -->
  <script src="https://unpkg.com/knockout@3.5.1/build/output/knockout-latest.js"></script>
  <link href="https://unpkg.com/survey-knockout@1.9.120/survey.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-knockout@1.9.120/survey.ko.min.js"></script>
  <script src="https://unpkg.com/survey-knockout@1.9.120/survey.locales.min.js"></script>

  <style>
    :root {
      /* ألوان أزرق ملكي */
      --primary-color: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-dark: #1e40af;
      
      /* خلفيات الوضع الفاتح */
      --bg-main: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    [data-theme="dark"] {
      --bg-main: #111827;
      --bg-card: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
    }

    * { box-sizing: border-box; transition: background 0.3s, color 0.3s, border 0.3s; }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-main);
      margin: 0;
      padding: 0;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* --- الهيدر --- */
    header {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      padding: 15px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }

    .logo-icon {
      width: 45px; height: 45px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-color);
      font-size: 22px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .site-title { font-size: 1.4rem; font-weight: 900; margin: 0; letter-spacing: -0.5px; }

    .theme-toggle {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      width: 45px; height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover { background: rgba(255,255,255,0.25); }

    /* --- الحاوية --- */
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: var(--bg-card);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    h1 { color: var(--primary-color); text-align: center; margin-bottom: 30px; font-weight: 900; font-size: 2rem; }
    
    .form-group { margin-bottom: 25px; }
    label { display: block; margin-bottom: 10px; font-weight: 700; color: var(--text-main); font-size: 1.1rem; }
    
    input {
      width: 100%; padding: 15px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 16px;
      font-family: 'Cairo', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }
    input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }

    button.main-btn {
      width: 100%;
      background: linear-gradient(to left, var(--primary-color), var(--primary-light));
      color: white;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
    }
    button.main-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4); }

    /* --- تنسيق SurveyJS --- */
    #surveyContainer { margin-top: 10px; }
    
    .sd-root-modern {
      font-family: 'Cairo', sans-serif !important;
      color: var(--text-main) !important;
    }
    
    .sd-page {
      background: var(--bg-main) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 12px !important;
      padding: 30px !important;
      margin-bottom: 20px;
    }

    .sd-title { font-weight: 800 !important; color: var(--text-main) !important; font-size: 1.1rem !important; }

    .sd-btn {
      background: var(--primary-color) !important;
      color: white !important;
      font-family: 'Cairo', sans-serif !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      padding: 10px 30px !important;
      border: none !important;
      font-size: 16px !important;
    }
    .sd-btn:hover { background: var(--primary-dark) !important; }
    .sd-navigation__complete-btn { background: #16a34a !important; }
    
    .sd-progress { background: var(--border-color) !important; height: 8px !important; border-radius: 4px; }
    .sd-progress__bar { background: var(--primary-color) !important; border-radius: 4px; }

    /* --- حالات العرض --- */
    .status-box { text-align: center; font-size: 18px; margin: 30px 0; padding: 25px; border-radius: 12px; }
    #loading { background: #eff6ff; color: #1e40af; }
    #error { background: #fef2f2; color: #b91c1c; }

    /* شاشة النجاح */
    .success-card {
      text-align: center;
      padding: 40px 20px;
    }
    .checkmark-icon {
      width: 80px; height: 80px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }
    
    /* دائرة النتيجة */
    .score-circle { position: relative; width: 140px; height: 140px; margin: 20px auto; }
    .score-circle svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .score-circle-bg { fill: none; stroke: var(--border-color); stroke-width: 10; }
    .score-circle-progress { fill: none; stroke: var(--primary-color); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1s ease; }
    .score-value { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* المؤقت */
    .timer-header { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; }
    .timer-text { font-size: 1.1rem; font-weight: 700; font-family: 'Cairo', sans-serif; }
    
    footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <div class="header-content">
      <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <h2 class="site-title">منصة الاختبارات</h2>
      </div>
      
      <div class="flex items-center gap-4">
        <!-- المؤقت -->
        <div id="timerBox" class="timer-header hidden">
            <i class="fas fa-clock"></i>
            <span id="timerDisplay" class="timer-text">00:00</span>
        </div>

        <!-- زر الوضع الليلي -->
        <button class="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع الليلي">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- المحتوى -->
  <div class="container">
    <h1 id="mainTitle">بدء الاختبار</h1>
    
    <!-- نموذج تسجيل الدخول -->
    <div id="studentForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="يرجى كتابة اسمك الثلاثي" required />
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button class="main-btn" onclick="startExam()">
        <i class="fas fa-play-circle" style="margin-left: 8px;"></i> ابدأ الاختبار الآن
      </button>
    </div>

    <!-- حالة التحميل -->
    <div id="loading" class="status-box" style="display:none;">
      <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i><br>
      جاري تحميل الأسئلة...
    </div>
    
    <!-- حالة الخطأ -->
    <div id="error" class="status-box" style="display:none;"></div>
    
    <!-- حاوية الاختبار -->
    <div id="surveyContainer"></div>
  </div>

  <footer>
    جميع الحقوق محفوظة &copy; 2024 - نظام إدارة الاختبارات
  </footer>

  <script>
    // --- إعدادات ---
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";
    let timerInterval;
    let timeRemaining = 0;

    // --- الوضع الليلي ---
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('themeIcon');
      if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        icon.className = 'fas fa-moon';
        localStorage.setItem('theme', 'light');
      } else {
        body.setAttribute('data-theme', 'dark');
        icon.className = 'fas fa-sun';
        localStorage.setItem('theme', 'dark');
      }
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
      document.getElementById('themeIcon').className = 'fas fa-sun';
    }

    // --- بدء الاختبار ---
    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !email.includes('@')) {
        alert('يرجى إدخال الاسم والبريد الإلكتروني بشكل صحيح');
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const examId = urlParams.get('exam');
      const token = urlParams.get('token');

      if (!examId || !token) {
        alert('خطأ: الرابط غير مكتمل');
        return;
      }

      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('mainTitle').textContent = "جاري التحميل...";

      try {
        const fetchUrl = `${GET_URL}?exam=${encodeURIComponent(examId)}&token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error("فشل الاتصال بالخادم");
        
        const responseData = await response.json();
        let surveyJson = Array.isArray(responseData) ? responseData[0] : responseData;
        
        // تنظيف البيانات
        if (surveyJson.pages) {
          surveyJson.pages.forEach(page => {
            if (page.elements) {
              page.elements.forEach(q => {
                if (q.correctAnswer) delete q.correctAnswer;
                if (q.choices && q.choices.length === 1 && q.choices[0] === 'Error') {
                  q.choices = ['خيار أ', 'خيار ب', 'خيار ج', 'خيار د'];
                }
              });
            }
          });
        }

        // تقسيم الأسئلة لصفحات (لإظهار أزرار التالي/السابق)
        if (surveyJson.pages && surveyJson.pages.length === 1 && surveyJson.pages[0].elements && surveyJson.pages[0].elements.length > 1) {
           const questions = surveyJson.pages[0].elements;
           const newPages = questions.map((q, index) => ({
             name: "page" + index,
             elements: [q]
           }));
           surveyJson.pages = newPages;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainTitle').textContent = surveyJson.title || "الاختبار";

        // تشغيل المؤقت
        const duration = surveyJson.durationMin || 15; // قيمة افتراضية 15 دقيقة
        startTimer(duration);

        // إعداد النموذج
        const survey = new Survey.Model(surveyJson);
        survey.locale = "ar";
        survey.showNavigationButtons = true;
        survey.showProgressBar = "top";
        survey.showTitle = false;

        document.getElementById('timerBox').classList.remove('hidden');

        survey.render("surveyContainer");

        // عند الإرسال
        survey.onComplete.add(async (sender) => {
          clearInterval(timerInterval);
          document.getElementById('timerBox').classList.add('hidden');
          
          // عرض رسالة إرسال مؤقتة
          document.getElementById("surveyContainer").innerHTML = `
             <div class="status-box" style="background:#eff6ff; color:#1e40af;">
                <i class="fas fa-paper-plane fa-spin" style="font-size:30px; margin-bottom:10px;"></i><br>
                جاري إرسال الإجابات...
             </div>`;

          const results = {
            exam: examId,
            token: token,
            studentName: name,
            studentEmail: email,
            answers: sender.data,
            finishedAt: new Date().toISOString()
          };

          try {
            const postRes = await fetch(POST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(results)
            });
            const resData = await postRes.json();
            showSuccessScreen(resData);

          } catch (e) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = "حدث خطأ أثناء الإرسال.";
          }
        });

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = `<i class="fas fa-exclamation-triangle"></i> خطأ: ${err.message}`;
      }
    }

    // --- وظائف المؤقت ---
    function startTimer(minutes) {
      timeRemaining = minutes * 60;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          // إجبار الإنهاء عند انتهاء الوقت
          if (window.survey) window.survey.completeLastPage();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      document.getElementById('timerDisplay').textContent = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // --- شاشة النجاح ---
    function showSuccessScreen(data) {
      const score = data.score || 0;
      const max = data.max || 100;
      const percentage = Math.round((score / max) * 100);
      
      // تشغيل التأثيرات
      if (percentage >= 50 && typeof confetti !== 'undefined') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      document.getElementById("surveyContainer").innerHTML = `
        <div class="success-card fade-in">
          <div class="checkmark-icon"><i class="fas fa-check"></i></div>
          <h2 style="color: var(--primary-color); font-size: 1.8rem; margin-bottom: 10px;">تم إرسال الاختبار بنجاح!</h2>
          <p style="color: var(--text-muted); margin-bottom: 30px;">شكراً لك، تم حفظ إجاباتك.</p>
          
          <div class="score-circle">
            <svg viewBox="0 0 140 140">
              <circle class="score-circle-bg" cx="70" cy="70" r="60"/>
              <circle class="score-circle-progress" id="scoreCircle" cx="70" cy="70" r="60"/>
            </svg>
            <div class="score-value">
              <span style="font-size: 2rem; font-weight: 900; color: var(--text-main);">${percentage}%</span>
              <span style="font-size: 0.9rem; color: var(--text-muted);">النتيجة</span>
            </div>
          </div>
          
          <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
             <div class="stat-card" style="padding:10px 20px; background:var(--bg-main); border-radius:10px;">
                <div style="font-weight:800; color:var(--primary-color); font-size:1.2rem;">${score}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">درجتك</div>
             </div>
             <div class="stat-card" style="padding:10px 20px; background:var(--bg-main); border-radius:10px;">
                <div style="font-weight:800; color:var(--text-muted); font-size:1.2rem;">${max}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">الدرجة الكلية</div>
             </div>
          </div>
        </div>
      `;

      // تحريك الدائرة
      setTimeout(() => {
        const circle = document.getElementById('scoreCircle');
        if (circle) {
          const circumference = 2 * Math.PI * 60;
          const offset = circumference - (percentage / 100) * circumference;
          circle.style.strokeDashoffset = offset;
        }
      }, 100);
    }
  </script>
</body>
</html>
