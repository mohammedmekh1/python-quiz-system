<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات - أساسيات البرمجة</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- SurveyJS CSS - نسخة محددة -->
  <link href="https://unpkg.com/survey-core@1.9.120/defaultV2.min.css" rel="stylesheet" />
  
  <!-- SurveyJS Scripts - نسخة محددة -->
  <script src="https://unpkg.com/survey-core@1.9.120/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-core@1.9.120/survey.i18n.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #2b4ec2; }
    #surveyContainer { margin-top: 30px; min-height: 500px; }
    #loading, #error { text-align: center; font-size: 18px; margin: 30px 0; display: none; }
    #error { color: #d32f2f; font-weight: bold; }
    #loading { color: #1e3a8a; }
    .success-msg { background: #4caf50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; }
    .debug-box { background: #fff3cd; border: 1px solid #ffeaa7; padding: 10px; margin: 10px 0; border-radius: 5px; font-size: 12px; direction: ltr; text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="mainTitle">تحميل الاختبار...</h1>
    
    <div id="studentForm">
      <div class="form-group">
        <label for="studentName">الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك هنا" required />
      </div>
      <div class="form-group">
        <label for="studentEmail">البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>

    <div id="loading">جاري جلب الأسئلة من السيرفر...</div>
    <div id="error"></div>
    <div id="debugInfo" class="debug-box" style="display:none;"></div>
    <div id="surveyContainer"></div>
  </div>

  <script>
    // روابط Webhook
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";

    // استخراج المعطيات من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token');

    if (examId) {
      document.getElementById('mainTitle').textContent = `اختبار: ${examId}`;
    }

    function showDebug(msg) {
      const debugDiv = document.getElementById('debugInfo');
      debugDiv.style.display = 'block';
      debugDiv.innerHTML += msg + '<br>';
    }

    // دالة لتنظيف البيانات
    function fixSurveyData(data) {
      if (data.pages && Array.isArray(data.pages)) {
        data.pages.forEach(page => {
          if (page.elements && Array.isArray(page.elements)) {
            page.elements.forEach(element => {
              if (element.correctAnswer) {
                element.correctAnswerValue = element.correctAnswer;
                delete element.correctAnswer;
              }
              if (element.choices && !Array.isArray(element.choices)) {
                element.choices = [];
              }
              if (element.choices && element.choices.length === 1 && element.choices[0] === 'Error') {
                element.choices = ['خيار 1', 'خيار 2', 'خيار 3', 'خيار 4'];
              }
            });
          }
        });
      }
      return data;
    }

    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !email.includes('@')) {
        alert('يرجى إدخال اسمك وبريدك الإلكتروني بشكل صحيح');
        return;
      }

      if (!examId || !token) {
        alert('خطأ: معرف الاختبار أو التوكن مفقود من الرابط');
        return;
      }

      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const fetchUrl = `${GET_URL}?exam=${encodeURIComponent(examId)}&token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        
        showDebug('جاري جلب البيانات...');
        const response = await fetch(fetchUrl);
        
        if (!response.ok) {
          throw new Error("فشل في جلب البيانات من السيرفر. تأكد من صحة التوكن.");
        }

        const responseData = await response.json();
        let surveyData = Array.isArray(responseData) ? responseData[0] : responseData;
        
        showDebug('البيانات المستلمة: ' + JSON.stringify(surveyData).substring(0, 100) + '...');
        
        surveyData = fixSurveyData(surveyData);
        showDebug('عدد الصفحات: ' + (surveyData.pages ? surveyData.pages.length : 0));
        showDebug('عدد الأسئلة: ' + (surveyData.pages && surveyData.pages[0] ? surveyData.pages[0].elements.length : 0));

        if (!surveyData || typeof surveyData !== 'object') {
          throw new Error("البيانات المستلمة غير صالحة");
        }

        if (!surveyData.pages || !Array.isArray(surveyData.pages)) {
          throw new Error("هيكل البيانات غير صحيح: pages مفقودة");
        }

        document.getElementById('loading').style.display = 'none';
        showDebug('جاري إنشاء نموذج SurveyJS...');

        // التأكد من تحميل SurveyJS
        if (typeof Survey === 'undefined') {
          throw new Error("مكتبة SurveyJS لم يتم تحميلها");
        }

        // إنشاء نموذج SurveyJS
        const survey = new Survey.Model(surveyData);
        survey.locale = "ar";
        
        showDebug('تم إنشاء النموذج، جاري العرض...');

        // عرض الاختبار
        survey.render("surveyContainer");
        
        showDebug('تم عرض الاختبار!');

        // معالجة إكمال الاختبار
        survey.onComplete.add(async (sender) => {
          const results = {
            exam: examId,
            token: token,
            studentName: name,
            studentEmail: email,
            answers: sender.data,
            finishedAt: new Date().toISOString()
          };

          try {
            await fetch(POST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(results)
            });
            
            document.getElementById('surveyContainer').innerHTML = 
              '<div class="success-msg">تم إرسال إجاباتك بنجاح! شكراً لك.</div>';
              
          } catch (postErr) {
            console.error("خطأ في إرسال النتائج:", postErr);
            alert("تم إكمال الاختبار لكن حدث خطأ في إرسال النتائج");
          }
        });

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = "خطأ: " + err.message;
        document.getElementById('error').style.display = 'block';
        showDebug('خطأ: ' + err.message);
        console.error("Error Details:", err);
      }
    }
  </script>
</body>
</html>
