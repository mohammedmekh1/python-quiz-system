<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="نظام اختبارات بايثون الاحترافي">
    <title>نظام اختبارات بايثون</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
    <link href="https://unpkg.com/survey-core/defaultV2.min.css" rel="stylesheet" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #ffffff; --bg-secondary: #ffffff; --bg-tertiary: #f8fafc;
            --text-primary: #1a2332; --text-secondary: #4a5568; --accent: #2563eb;
            --accent-hover: #1d4ed8; --border: #e2e8f0; --shadow: rgba(0, 0, 0, 0.05);
        }
        .dark {
            --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
            --text-primary: #f0f6fc; --text-secondary: #c9d1d9; --accent: #3b82f6;
            --border: #30363d; --shadow: rgba(0, 0, 0, 0.4);
        }
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; transition: all 0.3s ease; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 4px 12px var(--shadow); position: relative; z-index: 10; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .input-field { width: 100%; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); }
        .btn-primary { background: var(--accent); color: white; font-weight: 600; padding: 12px 24px; border-radius: 10px; transition: all 0.2s ease; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        #surveyContainer { min-height: 400px; }
    </style>
</head>
<body class="antialiased">
    <header class="card fixed top-0 left-0 right-0 z-50 rounded-none border-t-0 border-x-0">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center bg-blue-600">
                    <i class="fab fa-python text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold">Python Quiz</h1>
                    <p id="header-subtitle" class="text-xs text-gray-500">نظام الاختبارات الاحترافي</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="timer-wrapper" class="hidden flex items-center gap-2 px-3 py-1.5 rounded-full border border-gray-200">
                    <i class="fas fa-clock text-blue-600"></i>
                    <span id="timer-display" class="font-mono font-bold text-sm">00:00</span>
                </div>
                <button id="theme-toggle" class="p-2 rounded-lg border border-gray-200 hover:bg-gray-50">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="relative z-10 container mx-auto px-4 pt-24 pb-8">
        <div id="loading-state" class="flex flex-col items-center justify-center min-h-[60vh]">
            <div class="spinner mb-4"></div>
            <p id="loading-message" class="text-gray-500">جاري الاتصال بالنظام...</p>
        </div>

        <div id="error-state" class="hidden max-w-md mx-auto card p-8 text-center">
            <i class="fas fa-exclamation-circle text-red-500 text-4xl mb-4"></i>
            <h2 class="text-xl font-bold mb-2">عذراً، حدث خطأ</h2>
            <p id="error-message" class="text-gray-600 mb-6"></p>
            <button onclick="location.reload()" class="btn-primary">إعادة المحاولة</button>
        </div>

        <div id="start-form-state" class="hidden max-w-lg mx-auto card p-8">
            <h2 id="start-exam-title" class="text-2xl font-bold text-center mb-2"></h2>
            <p id="start-exam-desc" class="text-center text-gray-500 mb-8"></p>
            <form id="student-info-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">الاسم الكامل</label>
                    <input type="text" id="student-name" class="input-field" placeholder="أدخل اسمك الثلاثي" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                    <input type="email" id="student-email" class="input-field text-left" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn-primary">ابدأ الاختبار الآن</button>
            </form>
        </div>

        <div id="survey-wrapper" class="hidden max-w-4xl mx-auto">
            <div id="surveyContainer"></div>
        </div>

        <div id="success-state" class="hidden max-w-2xl mx-auto card p-8 text-center">
            <i class="fas fa-check-circle text-green-500 text-5xl mb-4"></i>
            <h2 id="result-title" class="text-3xl font-black mb-2">تم التسليم بنجاح</h2>
            <p id="result-message" class="text-gray-500 mb-8">لقد تم حفظ إجاباتك في النظام.</p>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="p-4 bg-gray-50 rounded-xl">
                    <span class="block text-2xl font-bold text-blue-600" id="res-exam-id">-</span>
                    <span class="text-xs text-gray-400">معرف الاختبار</span>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl">
                    <span class="block text-2xl font-bold" id="res-time">-</span>
                    <span class="text-xs text-gray-400">وقت التسليم</span>
                </div>
            </div>
            <p class="text-sm text-gray-400">سيتم مراجعة النتائج وإبلاغك بالدرجة لاحقاً.</p>
        </div>
    </main>

    <script>
        const CONFIG = {
            BASE_URL: 'https://n8n.srv1332143.hstgr.cloud/webhook',
            ENDPOINTS: { GET_SURVEY: '/get-survey', SUBMIT_EXAM: '/submit-exam' }
        };

        const state = {
            examId: '', token: '', examData: null,
            startTime: null, timerInterval: null
        };

        const DOM = {
            loadingState: document.getElementById('loading-state'),
            errorState: document.getElementById('error-state'),
            startFormState: document.getElementById('start-form-state'),
            surveyWrapper: document.getElementById('survey-wrapper'),
            successState: document.getElementById('success-state'),
            timerWrapper: document.getElementById('timer-wrapper'),
            timerDisplay: document.getElementById('timer-display')
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            state.examId = urlParams.get('exam') || urlParams.get('exam_id');
            state.token = urlParams.get('token');

            if (!state.examId) {
                showError("الرابط ناقص", "يرجى استخدام رابط الاختبار الصحيح المحتوي على معرف الاختبار.");
                return;
            }
            fetchSurvey();
            
            document.getElementById('theme-toggle').onclick = () => {
                document.documentElement.classList.toggle('dark');
            };
        });

        async function fetchSurvey() {
            try {
                const response = await fetch(`${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.GET_SURVEY}?exam_id=${state.examId}&token=${state.token}`);
                if (!response.ok) throw new Error("فشل الاتصال بـ n8n");
                const data = await response.json();
                
                state.examData = data;
                showStartForm(data);
            } catch (e) {
                showError("خطأ في جلب البيانات", e.message);
            }
        }

        function showStartForm(data) {
            DOM.loadingState.classList.add('hidden');
            DOM.startFormState.classList.remove('hidden');
            document.getElementById('start-exam-title').textContent = data.title || "اختبار جديد";
            document.getElementById('start-exam-desc').textContent = `المدة: ${data.durationMin || 15} دقيقة`;
            
            document.getElementById('student-info-form').onsubmit = (e) => {
                e.preventDefault();
                startExam();
            };
        }

        function startExam() {
    // 1. إظهار وإخفاء العناصر
    DOM.startFormState.classList.add('hidden');
    DOM.surveyWrapper.classList.remove('hidden');
    DOM.timerWrapper.classList.remove('hidden');
    
    state.startTime = Date.now();
    
    // 2. إنشاء النموذج
    const survey = new Survey.Model(state.examData);
    survey.locale = 'ar';
    
    // 3. الربط بالعنصر (هذا هو الإصلاح)
    // نستخدم معرف العنصر مباشرة في الطريقة المتوافقة مع الـ UI
    const surveyElement = document.getElementById("surveyContainer");
    if (surveyElement) {
        // نستخدم Render الخاص بـ SurveyJS UI
        const surveyUI = new Survey.Survey(survey);
        surveyUI.render(surveyElement);
    }
    
    // 4. الأحداث
    survey.onComplete.add(result => {
        submitAnswers(result.data);
    });

    startTimer(state.examData.durationMin || 15);
}

        function startTimer(mins) {
            let timeLeft = mins * 60;
            state.timerInterval = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                DOM.timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    alert("انتهى الوقت!");
                    // الإرسال التلقائي غير مفعل هنا لضمان عدم ضياع البيانات
                }
            }, 1000);
        }

        async function submitAnswers(answers) {
            clearInterval(state.timerInterval);
            DOM.surveyWrapper.classList.add('hidden');
            DOM.loadingState.classList.remove('hidden');
            document.getElementById('loading-message').textContent = "جاري إرسال إجاباتك...";

            try {
                const payload = {
                    exam: state.examId,
                    token: state.token,
                    studentName: document.getElementById('student-name').value,
                    studentEmail: document.getElementById('student-email').value,
                    answers: answers,
                    timeSpent: Math.floor((Date.now() - state.startTime) / 1000)
                };

                const res = await fetch(`${CONFIG.BASE_URL}${CONFIG.ENDPOINTS.SUBMIT_EXAM}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    DOM.loadingState.classList.add('hidden');
                    DOM.successState.classList.remove('hidden');
                    document.getElementById('res-exam-id').textContent = state.examId;
                    document.getElementById('res-time').textContent = new Date().toLocaleTimeString('ar-EG');
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                } else {
                    throw new Error("فشل إرسال النتائج للسيرفر");
                }
            } catch (e) {
                showError("خطأ في التسليم", e.message);
            }
        }

        function showError(t, m) {
            DOM.loadingState.classList.add('hidden');
            DOM.errorState.classList.remove('hidden');
            document.getElementById('error-message').textContent = m;
        }
    </script>
</body>
</html>
