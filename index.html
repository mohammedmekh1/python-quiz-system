<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام الاختبارات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- SurveyJS (تم التصحيح) -->
  <link href="https://unpkg.com/survey-knockout@1.9.120/survey.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-knockout@1.9.120/survey.ko.min.js"></script>
  <!-- ملف اللغة العربية -->
  <script src="https://unpkg.com/survey-knockout@1.9.120/survey.locales.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #2b4ec2; }
    #surveyContainer { margin-top: 30px; min-height: 500px; }
    #loading, #error { text-align: center; font-size: 18px; margin: 30px 0; display: none; }
    #error { color: #d32f2f; font-weight: bold; }
    #loading { color: #1e3a8a; }
    
    /* تنسيق RTL */
    .sd-root-modern { direction: rtl !important; text-align: right; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="mainTitle">اختبار</h1>
    
    <div id="studentForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك هنا" required />
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>

    <div id="loading">جاري التحميل...</div>
    <div id="error"></div>
    <div id="surveyContainer"></div>
  </div>

  <script>
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";
    
    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token');

    async function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();

      if (!name || !email.includes('@')) {
        alert('يرجى إدخال الاسم والبريد الإلكتروني بشكل صحيح');
        return;
      }

      if (!examId || !token) {
        alert('خطأ: معرف الاختبار أو التوكن مفقود');
        return;
      }

      document.getElementById('studentForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      try {
        const fetchUrl = `${GET_URL}?exam=${encodeURIComponent(examId)}&token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
        
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error("فشل في جلب البيانات");
        
        const responseData = await response.json();
        let surveyJson = Array.isArray(responseData) ? responseData[0] : responseData;
        
        // تنظيف البيانات
        if (surveyJson.pages) {
          surveyJson.pages.forEach(page => {
            if (page.elements) {
              page.elements.forEach(q => {
                if (q.correctAnswer) delete q.correctAnswer;
                if (q.choices && q.choices.length === 1 && q.choices[0] === 'Error') {
                  q.choices = ['خيار أ', 'خيار ب', 'خيار ج', 'خيار د'];
                }
              });
            }
          });
        }
        
        if (surveyJson.firstPageIsStarted) {
          surveyJson.firstPageIsStarted = false;
        }
        
        document.getElementById('loading').style.display = 'none';

        // تهيئة النموذج
        const survey = new Survey.Model(surveyJson);
        survey.locale = "ar";
        survey.showNavigationButtons = true;
        survey.showProgressBar = "top";
        
        // العرض
        survey.render("surveyContainer");

        // عند الإكمال
        survey.onComplete.add(async (sender) => {
          const results = {
            exam: examId,
            token: token,
            studentName: name,
            studentEmail: email,
            answers: sender.data,
            finishedAt: new Date().toISOString()
          };

          try {
            await fetch(POST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(results)
            });
            document.getElementById("surveyContainer").innerHTML = "<div style='text-align:center; padding:40px; color:green; font-size:20px;'>تم إرسال الإجابات بنجاح!</div>";
          } catch (e) {
            console.error("خطأ في الإرسال:", e);
            alert("حدث خطأ أثناء إرسال الإجابات.");
          }
        });

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = "خطأ: " + err.message;
        document.getElementById('error').style.display = 'block';
        console.error(err);
      }
    }
  </script>
</body>
</html>
