<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الامتحانات الإلكترونية</title>
    
    <!-- Google Fonts - Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SurveyJS - إصدار ثابت ومستقر -->
    <script src="https://unpkg.com/survey-core@1.9.139/survey.core.min.js"></script>
    <link href="https://unpkg.com/survey-core@1.9.139/defaultV2.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* ========== المتغيرات الأساسية ========== */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --primary-bg: #eff6ff;
            --success: #059669;
            --success-light: #ecfdf5;
            --success-border: #a7f3d0;
            --error: #dc2626;
            --error-light: #fef2f2;
            --error-border: #fecaca;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --warning-border: #fde68a;
            --background: #ffffff;
            --background-secondary: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --border-light: #f3f4f6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 16px;
            --radius-sm: 8px;
            --radius-lg: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--background);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.7;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 16px 24px;
        }

        .app-header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .app-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .app-logo svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
        }

        .app-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
            width: 100%;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: var(--background-secondary);
            padding: 32px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .card-header-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: var(--shadow-lg);
        }

        .card-header-icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card-body {
            padding: 32px;
        }

        .loading-screen, .error-screen {
            text-align: center;
            padding: 60px 30px;
        }

        .loading-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: var(--error-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            color: var(--error);
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--error);
            margin-bottom: 8px;
        }

        .error-message {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .registration-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-label .required {
            color: var(--error);
        }

        .form-label svg {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
            direction: rtl;
            text-align: right;
            background: var(--background);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-bg);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .info-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--background-secondary);
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .badge svg {
            width: 18px;
            height: 18px;
            color: var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--background-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border-light);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-bg);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .timer-bar {
            position: fixed;
            top: 77px;
            left: 0;
            right: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            z-index: 90;
        }

        .timer-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .timer-label svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        .timer-value {
            font-size: 1.75rem;
            font-weight: 800;
            font-family: 'Cairo', monospace;
            color: var(--text);
            min-width: 80px;
            text-align: center;
        }

        .timer-value.warning {
            color: var(--warning);
            animation: pulse 1s infinite;
        }

        .timer-value.danger {
            color: var(--error);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .timer-progress {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }

        .timer-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 2px;
            transition: width 1s linear;
        }

        .timer-progress-bar.warning {
            background: linear-gradient(90deg, var(--warning) 0%, #fbbf24 100%);
        }

        .timer-progress-bar.danger {
            background: linear-gradient(90deg, var(--error) 0%, #f87171 100%);
        }

        .exam-container {
            padding-top: 160px;
            padding-bottom: 40px;
        }

        .exam-container.no-timer {
            padding-top: 100px;
        }

        .result-header {
            padding: 48px;
            text-align: center;
        }

        .result-header.passed {
            background: linear-gradient(135deg, var(--success) 0%, #047857 100%);
            color: white;
        }

        .result-header.failed {
            background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
            color: white;
        }

        .result-icon {
            width: 88px;
            height: 88px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
        }

        .result-icon svg {
            width: 48px;
            height: 48px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .result-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 28px;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: var(--background-secondary);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-value.success { color: var(--success); }
        .stat-value.error { color: var(--error); }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .questions-details {
            padding: 0 28px 28px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .section-title svg {
            width: 22px;
            height: 22px;
            color: var(--primary);
        }

        .question-item {
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 12px;
            border: 2px solid;
            transition: all 0.2s;
        }

        .question-item:hover {
            transform: translateX(-4px);
        }

        .question-item.correct {
            background: var(--success-light);
            border-color: var(--success-border);
        }

        .question-item.incorrect {
            background: var(--error-light);
            border-color: var(--error-border);
        }

        .question-item.unanswered {
            background: var(--warning-light);
            border-color: var(--warning-border);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .question-icon {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-item.correct .question-icon {
            background: var(--success);
            color: white;
        }

        .question-item.incorrect .question-icon {
            background: var(--error);
            color: white;
        }

        .question-item.unanswered .question-icon {
            background: var(--warning);
            color: white;
        }

        .question-icon svg {
            width: 18px;
            height: 18px;
        }

        .question-content {
            flex: 1;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
            line-height: 1.6;
        }

        .question-answer {
            font-size: 0.95rem;
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .question-answer span {
            color: var(--text-muted);
        }

        .question-answer .correct-answer {
            color: var(--success);
            font-weight: 700;
        }

        .question-answer .wrong-answer {
            color: var(--error);
            font-weight: 700;
        }

        .question-points {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .question-points svg {
            width: 16px;
            height: 16px;
        }

        .submission-info {
            text-align: center;
            padding: 20px;
            background: var(--background-secondary);
            border-radius: var(--radius-sm);
            margin: 0 28px 28px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .submission-info p {
            margin: 4px 0;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 0 28px 28px;
        }

        .action-buttons .btn {
            flex: 1;
        }

        @media print {
            body {
                background: white;
            }
            .app-header, .timer-bar, .action-buttons {
                display: none !important;
            }
            .container {
                min-height: auto;
                padding: 0;
            }
            .card {
                box-shadow: none;
                border: none;
            }
            .exam-container {
                padding-top: 0;
            }
            .result-header {
                border-radius: 0;
            }
        }

        /* تخصيص SurveyJS */
        .sv_main.sv_default_css {
            direction: rtl !important;
            font-family: 'Cairo', sans-serif !important;
        }

        .sv_container {
            direction: rtl !important;
        }

        .sv_title {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            text-align: center !important;
            margin-bottom: 1rem !important;
            color: var(--text) !important;
        }

        .sv_description {
            text-align: center !important;
            color: var(--text-muted) !important;
            font-size: 1rem !important;
        }

        .sv_p_root {
            padding: 1.5rem !important;
        }

        .sv_q {
            padding: 1.25rem !important;
            margin-bottom: 1rem !important;
            border-radius: var(--radius-sm) !important;
            background: var(--background-secondary) !important;
            border: 1px solid var(--border) !important;
        }

        .sv_q_title {
            font-size: 1.05rem !important;
            font-weight: 600 !important;
            color: var(--text) !important;
            text-align: right !important;
            font-family: 'Cairo', sans-serif !important;
        }

        .sv_q_description {
            color: var(--text-muted) !important;
            font-size: 0.9rem !important;
        }

        .sv_item {
            direction: rtl !important;
            text-align: right !important;
            padding: 12px 14px !important;
            border-radius: var(--radius-sm) !important;
            margin-bottom: 6px !important;
            transition: all 0.2s !important;
        }

        .sv_item:hover {
            background: var(--primary-bg) !important;
        }

        .sv_q_radiogroup_control_item,
        .sv_q_checkbox_control_item {
            margin-left: 12px !important;
            margin-right: 0 !important;
        }

        .sv_q_radiogroup_label,
        .sv_q_checkbox_label {
            font-family: 'Cairo', sans-serif !important;
            font-size: 1rem !important;
        }

        .sv_btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: var(--radius-sm) !important;
            padding: 12px 28px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            font-family: 'Cairo', sans-serif !important;
            box-shadow: var(--shadow-md) !important;
        }

        .sv_btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .sv_nav {
            direction: rtl !important;
            margin-top: 1.5rem !important;
            padding-top: 1.5rem !important;
            border-top: 1px solid var(--border) !important;
        }

        .sv_progress {
            background: var(--border) !important;
            border-radius: 4px !important;
            height: 8px !important;
        }

        .sv_progress_bar {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%) !important;
            border-radius: 4px !important;
        }

        .submit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .submit-overlay .card {
            max-width: 320px;
        }

        .submit-overlay .card-body {
            text-align: center;
            padding: 40px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            background: var(--background-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .empty-state-icon svg {
            width: 40px;
            height: 40px;
            color: var(--text-muted);
        }

        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .empty-state-text {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .demo-link {
            background: var(--background-secondary);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            word-break: break-all;
        }

        /* ميزات منع الغش - تحذير */
        .cheating-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(220, 38, 38, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .cheating-warning h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .cheating-warning p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- الشعار والأيقونة -->
    <header class="app-header">
        <div class="app-header-content">
            <div class="app-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <div>
                <div class="app-title">نظام الامتحانات الإلكترونية</div>
                <div class="app-subtitle">منصة الاختبارات التفاعلية</div>
            </div>
        </div>
    </header>

    <!-- التطبيق الرئيسي -->
    <div id="app"></div>

    <script>
        // ========== إعدادات n8n ==========
        const N8N_CONFIG = {
            BASE_URL: 'https://n8n.srv1332143.hstgr.cloud/webhook'
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);

            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        // ========== ميزات منع الغش ==========
        function initAntiCheating() {
            // منع Right Click
            document.addEventListener('contextmenu', function(e) {
                if (appState.examStarted) {
                    e.preventDefault();
                    handleCheatingAttempt('right_click');
                    return false;
                }
            });

            // منع F12 و Ctrl+Shift+I و Ctrl+U
            document.addEventListener('keydown', function(e) {
                if (!appState.examStarted) return;
                
                // F12
                if (e.key === 'F12') {
                    e.preventDefault();
                    handleCheatingAttempt('f12');
                    return false;
                }
                
                // Ctrl+Shift+I (DevTools)
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    handleCheatingAttempt('devtools');
                    return false;
                }
                
                // Ctrl+U (View Source)
                if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                    e.preventDefault();
                    handleCheatingAttempt('view_source');
                    return false;
                }
                
                // Ctrl+C (Copy)
                if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
                    e.preventDefault();
                    handleCheatingAttempt('copy');
                    return false;
                }
                
                // Ctrl+V (Paste)
                if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) {
                    e.preventDefault();
                    handleCheatingAttempt('paste');
                    return false;
                }
            });

            // كشف مغادرة النافذة
            document.addEventListener('visibilitychange', function() {
                if (appState.examStarted && document.hidden) {
                    handleCheatingAttempt('tab_switch');
                }
            });

            // كشف فقدان التركيز
            window.addEventListener('blur', function() {
                if (appState.examStarted) {
                    handleCheatingAttempt('window_blur');
                }
            });

            // تحذير قبل مغادرة الصفحة
            window.addEventListener('beforeunload', function(e) {
                if (appState.examStarted && !appState.submitting) {
                    e.preventDefault();
                    e.returnValue = 'هل أنت متأكد من مغادرة الامتحان؟ سيتم إلغاؤه!';
                    return e.returnValue;
                }
            });
        }

        function handleCheatingAttempt(type) {
            appState.cheatingAttempts++;
            console.warn(`محاولة غش #${appState.cheatingAttempts}: ${type}`);
            
            // بعد 3 محاولات، ننهي الامتحان
            if (appState.cheatingAttempts >= 3) {
                showCheatingWarning();
                if (appState.survey) {
                    setTimeout(() => {
                        appState.survey.completeLastPage();
                    }, 2000);
                }
            } else {
                alert(`⚠️ تحذير: تم اكتشاف محاولة غش (${appState.cheatingAttempts}/3)\n\nنوع المحاولة: ${type}\n\nبعد 3 محاولات سيتم إنهاء الامتحان تلقائياً!`);
            }
        }

        // ========== تهيئة SurveyJS ==========
        function initSurvey() {
            try {
                const container = document.getElementById('surveyContainer');
                if (!container) {
                    console.error('Survey container not found');
                    return;
                }

                // إنشاء نموذج SurveyJS
                const survey = new Survey.Model(appState.surveyData);
                
                // تعيين اللغة العربية
                survey.locale = 'ar';
                
                // إخفاء عنوان الصفحة (نستخدم تصميمنا الخاص)
                survey.showTitle = false;
                
                // عند اكتمال الامتحان
                survey.onComplete.add(async function(sender) {
                    const data = sender.data;
                    const answers = {};
                    
                    // تحويل البيانات إلى التنسيق المطلوب
                    for (let key in data) {
                        if (data.hasOwnProperty(key)) {
                            answers[key] = data[key];
                        }
                    }
                    
                    await submitExam(answers);
                });
                
                // حفظ المرجع
                appState.survey = survey;
                
                // تفعيل ميزات منع الغش
                appState.examStarted = true;
                initAntiCheating();
                
                // بدء المؤقت
                if (appState.timeRemaining > 0) {
                    startTimer();
                }
                
                // عرض الاستبيان
                survey.render(container);
                
            } catch (error) {
                console.error('Error initializing survey:', error);
                appState.error = 'فشل في تحميل الأسئلة: ' + error.message;
                appState.currentView = 'error';
                render();
            }
        }

        // ========== المؤقت ==========
        function startTimer() {
            const totalTime = appState.surveyData.maxTimeToFinish;
            
            appState.timerInterval = setInterval(() => {
                appState.timeRemaining--;
                
                const timerValue = document.getElementById('timerValue');
                const timerProgress = document.getElementById('timerProgress');
                
                if (timerValue) {
                    timerValue.textContent = formatTime(appState.timeRemaining);
                    
                    timerValue.classList.remove('warning', 'danger');
                    timerProgress?.classList.remove('warning', 'danger');
                    
                    if (appState.timeRemaining <= 60) {
                        timerValue.classList.add('danger');
                        timerProgress?.classList.add('danger');
                    } else if (appState.timeRemaining <= 180) {
                        timerValue.classList.add('warning');
                        timerProgress?.classList.add('warning');
                    }
                }
                
                if (timerProgress) {
                    const percentage = (appState.timeRemaining / totalTime) * 100;
                    timerProgress.style.width = `${percentage}%`;
                }
                
                if (appState.timeRemaining <= 0) {
                    clearInterval(appState.timerInterval);
                    if (appState.survey) {
                        appState.survey.completeLastPage();
                    }
                }
            }, 1000);
        }

        // ========== تحميل الامتحان التجريبي ==========
        function loadDemoExam() {
            appState.examId = 'DEMO';
            appState.token = 'DEMO123';
            appState.surveyData = DEMO_SURVEY;
            appState.currentView = 'registration';
            render();
        }

        // ========== العودة للصفحة الرئيسية ==========
        function goHome() {
            window.location.href = window.location.pathname;
        }

        // ========== جلب بيانات الامتحان ==========
        async function fetchSurvey() {
            const params = getQueryParams();
            
            if (!params.examId || !params.token) {
                appState.currentView = 'empty';
                render();
                return;
            }
            
            appState.examId = params.examId;
            appState.token = params.token;
            
            // الوضع التجريبي
            if (params.examId.toUpperCase() === 'DEMO' && params.token === 'DEMO123') {
                appState.surveyData = DEMO_SURVEY;
                appState.currentView = 'registration';
                render();
                return;
            }
            
            try {
                const url = `${getGetSurveyUrl()}?exam_id=${encodeURIComponent(params.examId)}&token=${encodeURIComponent(params.token)}`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'فشل في تحميل الامتحان');
                }
                
                const data = await response.json();
                
                // التأكد من صحة البيانات
                if (!data.pages || !data.pages[0] || !data.pages[0].elements) {
                    throw new Error('بيانات الامتحان غير مكتملة');
                }
                
                appState.surveyData = data;
                appState.currentView = 'registration';
                render();
                
            } catch (error) {
                console.error('Error fetching survey:', error);
                appState.error = error.message;
                appState.currentView = 'error';
                render();
            }
        }

        // ========== بدء الامتحان ==========
        function handleStartExam(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById('studentName');
            const emailInput = document.getElementById('studentEmail');
            
            appState.studentName = nameInput.value.trim();
            appState.studentEmail = emailInput.value.trim();
            
            if (!appState.studentName) {
                nameInput.focus();
                nameInput.style.borderColor = 'var(--error)';
                setTimeout(() => {
                    nameInput.style.borderColor = '';
                }, 2000);
                return;
            }
            
            appState.startTime = Date.now();
            
            if (appState.surveyData.maxTimeToFinish) {
                appState.timeRemaining = parseInt(appState.surveyData.maxTimeToFinish);
            }
            
            appState.currentView = 'exam';
            render();
        }

        // ========== تقديم الامتحان ==========
        async function submitExam(answers) {
            appState.submitting = true;
            appState.examStarted = false; // إيقاف ميزات منع الغش
            render();
            
            const timeSpent = Math.floor((Date.now() - appState.startTime) / 1000);
            
            const payload = {
                exam: appState.examId,
                token: appState.token,
                answers: answers,
                studentName: appState.studentName,
                studentEmail: appState.studentEmail || null,
                timeSpent: timeSpent,
                finishedAt: new Date().toISOString(),
                cheatingAttempts: appState.cheatingAttempts
            };
            
            // الوضع التجريبي
            if (appState.examId.toUpperCase() === 'DEMO') {
                const result = calculateDemoResult(answers, timeSpent);
                appState.result = result;
                appState.submitting = false;
                appState.currentView = 'result';
                
                if (appState.timerInterval) {
                    clearInterval(appState.timerInterval);
                }
                
                render();
                return;
            }
            
            try {
                const response = await fetch(getSubmitUrl(), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'فشل في تقديم الامتحان');
                }
                
                const result = await response.json();
                appState.result = result;
                appState.currentView = 'result';
                
            } catch (error) {
                console.error('Error submitting exam:', error);
                alert('حدث خطأ أثناء تقديم الامتحان: ' + error.message);
                appState.submitting = false;
            }
            
            if (appState.timerInterval) {
                clearInterval(appState.timerInterval);
            }
            
            render();
        }

        // ========== حساب النتيجة التجريبية ==========
        function calculateDemoResult(answers, timeSpent) {
            let totalScore = 0;
            let maxScore = 0;
            let correctCount = 0;
            const detailedResults = [];
            
            for (const [qId, correctData] of Object.entries(DEMO_CORRECT_ANSWERS)) {
                const studentAnswer = answers[qId];
                maxScore += correctData.points;
                
                const isMultipleChoice = Array.isArray(correctData.answer);
                let isCorrect = false;
                
                if (studentAnswer !== undefined && studentAnswer !== null) {
                    if (isMultipleChoice) {
                        const studentAnswers = Array.isArray(studentAnswer) ? studentAnswer : [studentAnswer];
                        const correctAnswers = correctData.answer;
                        isCorrect = correctAnswers.length === studentAnswers.length &&
                            correctAnswers.every(a => studentAnswers.includes(a));
                    } else {
                        isCorrect = studentAnswer === correctData.answer;
                    }
                }
                
                if (isCorrect) {
                    totalScore += correctData.points;
                    correctCount++;
                }
                
                detailedResults.push({
                    questionId: qId.replace('q_', ''),
                    question: correctData.question,
                    studentAnswer: studentAnswer ?? null,
                    correctAnswer: correctData.answer,
                    isCorrect: isCorrect,
                    score: isCorrect ? correctData.points : 0,
                    maxScore: correctData.points,
                    type: isMultipleChoice ? 'checkbox' : 'radiogroup'
                });
            }
            
            const percentage = maxScore > 0 ? ((totalScore / maxScore) * 100).toFixed(2) : '0';
            const passed = parseFloat(percentage) >= 60;
            
            return {
                success: true,
                submissionId: `DEMO_${appState.examId}_${Date.now()}`,
                examId: appState.examId,
                studentName: appState.studentName,
                studentEmail: appState.studentEmail,
                examInfo: {
                    title: appState.surveyData.title,
                    duration: Math.floor((appState.surveyData.maxTimeToFinish || 0) / 60)
                },
                results: {
                    totalScore: totalScore,
                    maxScore: maxScore,
                    percentage: percentage,
                    correctCount: correctCount,
                    totalQuestions: Object.keys(DEMO_CORRECT_ANSWERS).length,
                    passed: passed,
                    grade: passed ? 'Pass' : 'Fail'
                },
                detailedResults: detailedResults,
                timeSpent: timeSpent,
                submittedAt: new Date().toISOString(),
                finishedAt: new Date().toISOString()
            };
        }

        // ========== بدء التطبيق ==========
        document.addEventListener('DOMContentLoaded', () => {
            fetchSurvey();
        });
    </script>
</body>
</html>
