<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختبار بايثون – نظام الاختبارات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/survey-core@1.12.15/defaultV2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-core@1.12.15/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-core@1.12.15/survey.i18n.min.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #2b4ec2; }
    #surveyContainer { margin-top: 30px; }
    #loading, #error { text-align: center; font-size: 18px; margin: 30px 0; display: none; }
    #error { color: #d32f2f; font-weight: bold; }
    #loading { color: #1e3a8a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>اختبار بايثون</h1>
    <div id="studentForm">
      <div class="form-group">
        <label for="studentName">الاسم الكامل</label>
        <input type="text" id="studentName" placeholder="اكتب اسمك هنا" required />
      </div>
      <div class="form-group">
        <label for="studentEmail">البريد الإلكتروني</label>
        <input type="email" id="studentEmail" placeholder="example@domain.com" required />
      </div>
      <button onclick="startExam()">ابدأ الاختبار الآن</button>
    </div>
    <div id="loading">جاري تحميل الأسئلة...</div>
    <div id="error"></div>
    <div id="surveyContainer"></div>
  </div>

  <script>
    // 1. تحديد روابط n8n (يفضل استبدالها بمتغيرات Vercel في لوحة التحكم)
    const GET_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/get-survey";
    const POST_URL = "https://n8n.srv1332143.hstgr.cloud/webhook/submit-exam";

    const urlParams = new URLSearchParams(window.location.search);
    const examId = urlParams.get('exam');
    const token = urlParams.get('token') || 'default_token';

    if (!examId) {
      document.getElementById('error').textContent = 'خطأ: معرف الاختبار (exam) مفقود من الرابط.';
      document.getElementById('error').style.display = 'block';
    }

   async function startExam() {
  const name = document.getElementById('studentName').value.trim();
  const email = document.getElementById('studentEmail').value.trim();

  if (!name || !email) {
    alert('يرجى ملء الاسم والإيميل');
    return;
  }

  document.getElementById('studentForm').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  try {
    const url = \( {N8N_WEBHOOK}?exam= \){encodeURIComponent(examId)}&name=\( {encodeURIComponent(name)}&email= \){encodeURIComponent(email)};

    const response = await fetch(url);

    if (!response.ok) throw new Error(خطأ ${response.status});

    const data = await response.json();

    if (data.error) throw new Error(data.error);

    console.log('البيانات المستلمة:', data); // ده اللي ظهر عندك

    // إصلاحات مهمة لـ SurveyJS
    if (!data.pages || !Array.isArray(data.pages)) {
      throw new Error('الاستطلاع لا يحتوي على صفحات أو عناصر صالحة');
    }

    // تأكيد اللغة العربية
    Survey.surveyLocalization.currentLocale = "ar";

    // إنشاء النموذج
    const survey = new Survey.Model(data);

    // إضافة معالجة أخطاء داخلية
    survey.onError.add((sender, options) => {
      console.error('خطأ داخل SurveyJS:', options.error);
      document.getElementById('error').textContent = 'خطأ في عرض الأسئلة: ' + options.error;
      document.getElementById('error').style.display = 'block';
    });

    // عرض الاستطلاع
    survey.render("surveyContainer");

    document.getElementById('loading').style.display = 'none';

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').textContent = 'خطأ: ' + err.message;
    document.getElementById('error').style.display = 'block';
    console.error('خطأ كامل:', err);
  }
}
  </script>
</body>
</html>
